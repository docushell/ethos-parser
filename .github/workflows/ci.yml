name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For `v0-fuzz-smoke` and nothing else — every other job carries
  # `if: github.event_name != 'schedule'`. Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege. Both jobs check out a second repository and job 1 compiles and executes it,
# so the token this workflow carries should be able to do nothing but read.
permissions:
  contents: read

# The oracle build is the slowest step and is not covered by rust-cache (it lands in
# ethos-oracle/target). Superseded runs are therefore expensive, not cheap — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned the way the compiler is: one place, explicit, greppable, bumped deliberately.
  # 0.20.2 is a floor, not a preference — 0.18.3 aborts the whole advisories check on any
  # RustSec entry carrying a CVSS 4.0 vector (see deny.toml).
  CARGO_DENY_VERSION: "0.20.2"
  # The Ethos commit this engine is oracled against. Pinned for the same reason the fixture
  # corpus is pinned by sha256: docs/07-VERIFY-BOUNDARY.md §4 requires a verifier swap to be
  # visible. Unpinned, every run silently tests against whatever `main` is at that instant and
  # no ethos-parser commit records which verifier answered.
  #
  # 8adda91 == ethos v0.6.0, the release tag ("Make the release lane testable...", #239).
  # Bump deliberately, in its own commit. `ethos --version` cannot tell two builds of one version
  # apart, so re-run every test that reads ETHOS_BIN — oracle, verify_relay, markdown_cli,
  # html_cli, grounding, mcp_stdio — with ETHOS_BIN set to a build of the new ref, and move
  # ../ethos-oracle to it before trusting ci/gate.sh.
  ETHOS_ORACLE_REF: "8adda91cd01baae487c9f2b18e4054b58a378a20"

jobs:
  check:
    # The weekly `schedule` trigger exists for `v0-fuzz-smoke` alone; nothing else runs on it.
    if: github.event_name != 'schedule'
    name: build · test · clippy · fmt · deny
    runs-on: ubuntu-latest
    # This job RUNS the whole suite, so it is runtime-bound and wants workspace crates optimized;
    # Cargo.toml defaults them to 0 for the compile-bound labelling jobs (the table there says
    # why). Job-level rather than on `test` alone, so clippy, build and test share one set of
    # artifacts instead of recompiling the workspace at a second opt-level.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 2
      CARGO_PROFILE_TEST_OPT_LEVEL: 2
    # 90 rather than 45, because 45 was never a measurement. The `test` step reached CI for the
    # first time in this repository's history on 8e2b4e1 — every earlier run died at `fmt`
    # before it — and took 41m26s of a 44m22s job, clearing the old ceiling by 38 seconds on a
    # quiet runner with a warm cache. A cache miss or one more test file turns that into a
    # timeout, which reads as an infrastructure blip rather than the budget it actually is.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The two grep criteria, first: they scan source text, need no compiler and finish in
      # seconds, so a forbidden token fails this job before the oracle build rather than after it.
      # They are also `v0-exit-criteria` matrix entries below, but those labels run on pull requests
      # only, and a history merged locally opens none: from 2026-09-05 to 2026-09-17 no CI run
      # executed either grep. As steps here they run on every push to main. `ci/gate.sh` runs the
      # same two commands first, and `the_local_gate_runs_what_ci_runs` holds the two in step.
      - name: v0-no-confidence
        run: ci/forbidden-tokens.sh confidence

      - name: v0-no-verify
        run: ci/forbidden-tokens.sh verification

      # The oracle is a test-time dependency. Its absence is a FAILURE, never a skip
      # (docs/04-ARCHITECTURE.md §4), so the corpus and the verifier must both be present.
      #
      # docushell/ethos is PUBLIC, so the default GITHUB_TOKEN clones it. Do NOT add a `token:`
      # here: secrets are not exposed to workflow runs from forked repositories, so a
      # `${{ secrets.* }}` token would interpolate to empty and break every fork PR — turning a
      # working checkout into a broken one. If the repo ever goes private, that is the moment to
      # revisit, and the fix is a PAT, never making these steps optional.
      - name: Check out Ethos (fixture corpus + CLI oracle)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: docushell/ethos
          ref: ${{ env.ETHOS_ORACLE_REF }}
          path: ethos-oracle
          persist-credentials: false

      # rust-toolchain.toml is what actually selects 1.88.0: rustup re-reads it on every cargo
      # invocation and it outranks the rustup default. This action does not read that file — it
      # is here only to preinstall a toolchain and the rustfmt/clippy components. Naming 1.88.0
      # explicitly keeps the two in agreement instead of installing `stable` and relying on
      # rustup to quietly fetch 1.88.0 afterwards.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      # `key:` is a cache-buster, and it is load-bearing rather than decorative. rust-cache's key
      # does NOT hash Cargo.toml's profile section, so when v2-S14 moved dependencies to
      # `opt-level = 3` the key stayed byte-identical (`...-4129e3df-b139dc84`), every job
      # restored a cache full of UNOPTIMIZED dependency artifacts, and the post step reported
      # `Cache up-to-date.` — a GitHub cache entry cannot be overwritten, so it never refreshed.
      # The result was every job recompiling every dependency, every run, for good: run
      # 33358797372 had `v1s1-paths` at 199s against a 41s baseline.
      #
      # Bump this string whenever a profile change alters how dependencies are compiled. `fuzz`
      # below is deliberately NOT bumped: `fuzz/` is excluded from the workspace and carries its
      # own manifest, so the root profile does not reach it and its cache stays valid.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deps-opt3
          # The oracle builds into ethos-oracle/target, outside the default `.` workspace, so
          # without this it is the one expensive step the cache never covers.
          workspaces: |
            .
            ethos-oracle

      # Assert the pin rather than trusting it. If rust-toolchain.toml is ever moved or renamed,
      # cargo silently falls back to the rustup default and the "same compiler everywhere"
      # contract fails open. This is the tripwire.
      - name: Assert the toolchain pin is in force
        run: |
          set -euo pipefail
          want="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' rust-toolchain.toml | head -1)"
          got="$(cargo --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "rust-toolchain.toml wants $want; cargo reports $got"
          [ "$want" = "$got" ] || { echo "::error::toolchain pin not in force"; exit 1; }

      # RUSTFLAGS is set per-step, never at workflow level: at workflow level it would also
      # apply here, holding Ethos's source to a lint gate Ethos does not run on itself. A
      # warning in another repo would then fail this repo's CI with no fix available here.
      - name: Build the oracle
        working-directory: ethos-oracle
        run: cargo build --release --locked --bin ethos

      - name: Record the oracle identity
        run: |
          ./ethos-oracle/target/release/ethos --version
          echo "oracle ref: ${{ env.ETHOS_ORACLE_REF }}"

      # `docs/CAPABILITY.md` opens with its own rule — "When the workspace version moves, this page
      # moves with it or it is wrong" — and nothing enforced it. At 0.54.0 three files still said
      # 0.50.0: `README.md`, `docs/README.md` and `docs/CAPABILITY.md`. Same liveness failure the
      # SDK-suites comment below describes, on the page whose whole job is to say what the engine
      # can do today. A script rather than an inline grep, so `ci/gate.sh` runs the identical
      # command and `the_local_gate_runs_what_ci_runs` can compare them.
      - name: doc-version
        run: ci/doc-version.sh

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --locked

      - name: test
        env:
          RUSTFLAGS: "-D warnings"
          ETHOS_FIXTURES: ${{ github.workspace }}/ethos-oracle/fixtures
          ETHOS_BIN: ${{ github.workspace }}/ethos-oracle/target/release/ethos
          ETHOS_BENCH_CORPUS: ${{ github.workspace }}/ethos-oracle/benchmarks/gate-zero/corpus
        # M6: the exclusion is gone. `oracle_agrees_on_simple_text` was the M0 gate — it failed
        # by design for six milestones and now runs the real comparison, so the bare command is
        # the gate. Re-adding a `--skip` here to get a green build would delete the only thing
        # that proves this engine and the verifier read an artifact the same way.
        run: cargo test --workspace --locked

      # --- SDK guards -----------------------------------------------------------------------
      #
      # **These suites existed and had never run.** Both carry a test asserting their version
      # against `[workspace.package] version` in Cargo.toml, and each file says so in a comment —
      # and at v2-S15 the four numbers were 0.42.0 (Cargo), 0.36.1 (python `__init__.py`), 0.36.1
      # (node `index.js`) and 0.36.3 (node `package.json`). Six minor versions of drift behind
      # three guards, because nothing in this workflow had ever executed `node --test` or
      # `pytest`. That is the same liveness failure as 0.31.1's "guards that were never there".
      #
      # One `ci/*.sh` invocation rather than two `run:` steps, because
      # `the_local_gate_runs_what_ci_runs` compares this job against `ci/gate.sh` command by
      # command and reads the script's commands as the lines beginning `cargo ` or `ci/`. A check
      # both must run is therefore a script — the shape `ci/forbidden-tokens.sh` already uses.
      #
      # Run HERE rather than as their own job: both locators refuse a binary whose `--version`
      # disagrees with the workspace, so the suites need a built engine, and `build` above has
      # just produced one. A separate job would rebuild the workspace to re-derive it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: SDK suites (node + python)
        run: ci/sdk-suites.sh

      # Installed rather than run via EmbarkStudios/cargo-deny-action, for two reasons:
      #   1. That action exposes no input to pin the cargo-deny version — its only version
      #      control is the action ref itself, which hides the tool version behind a tag.
      #   2. Its `arguments` input defaults to `--all-features`, and cargo-deny ORs that with
      #      the config, so deny.toml's `[graph] all-features = false` cannot switch it back
      #      off. The gate would silently check a graph the committed config does not describe.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: deny
        run: cargo deny check

  # -----------------------------------------------------------------------------------------
  # docs/history/03-V0-SCOPE.md §5 — every exit criterion, as its own named job
  # -----------------------------------------------------------------------------------------
  #
  # M7's acceptance is that §5 is CI, not prose: a reviewer must be able to see *which line* is
  # green. `check` above runs the whole suite and is the umbrella gate; it is deliberately not
  # the proof, because one undifferentiated green tick cannot tell you that the classification
  # bound still holds — it can only tell you that nothing failed.
  #
  # So each criterion is a matrix entry with the criterion's own id as its job name. Re-running
  # the same tests under a label costs runner time and buys the thing this milestone is for: a
  # timing flake in the bound test shows up as `v0-classify-bound` failing, not as a mysterious
  # `cargo test`.
  #
  # `crates/ethos-parser-cli/tests/v0_exit_criteria.rs` asserts that every `- [x]` line in §5 names a
  # job id that appears in this file. Adding a criterion without a job, or renaming a job without
  # updating §5, fails there.
  #
  # Two flags keep the setup honest per entry:
  #   corpus  — check out the Ethos tree for its read-only fixtures
  #   oracle  — additionally build `ethos`, the slowest step, needed only where a test runs it
  #   rust    — install the pinned toolchain; false for the two criteria that are greps
  v0-exit-criteria:
    # Budget (v2-S14). These matrices re-run tests `check` has already run — their product is
    # the per-criterion LABEL, not extra coverage, and a label is only read during review. So
    # they run on pull requests and are skipped on pushes to main, where `check` is the gate.
    # `if:` rather than deletion, deliberately: `v0_exit_criteria.rs` asserts this matrix is
    # exactly fourteen entries and that every §5-named job exists in this file. A skipped job
    # keeps both true and bills nothing.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v0-happy-path
            criterion: "classify -> extract -> ground -> grounding-check on all 15 fixtures"
            corpus: true
            oracle: true
            rust: true
            run: cargo test -p ethos-parser-cli --test oracle --locked -- manifest_declares_fifteen_ethos_owned_fixtures oracle_agrees_on_all_ethos_owned_fixtures refused_fixtures_fail_closed_rather_than_producing_an_artifact

          - id: v0-double-run
            criterion: "double-run byte identity, on files and not merely payloads"
            corpus: true
            oracle: true
            rust: true
            # The only §5 entry that runs long enough for optimized workspace crates to pay for
            # their own compile — it emits every artifact twice. The other thirteen are
            # compile-bound and take Cargo.toml's opt-level 0.
            optimize: true
            run: cargo test --workspace --locked -- byte_identical two_runs_with_diagnostics_still_produce_identical_artifacts two_library_runs_produce_identical_bytes

          - id: v0-oracle
            criterion: "byte-identical agreement with `ethos grounding check`"
            corpus: true
            oracle: true
            rust: true
            run: cargo test -p ethos-parser-cli --test oracle --locked

          - id: v0-artifact-identity
            criterion: "artifact_type, schema_version, parser_version, profile_sha256 on every artifact"
            corpus: true
            oracle: false
            rust: true
            run: cargo test --workspace --locked -- the_artifact_carries_a_full_identity_envelope the_default_profile_is_pinned artifact_identity_round_trips_through_c14n the_profile_schema_example_is_the_real_profile

          - id: v0-coordinates
            criterion: "every artifact carrying geometry declares coordinate_system"
            corpus: true
            oracle: false
            rust: true
            run: cargo test --workspace --locked -- every_geometry_bearing_artifact_declares_its_coordinate_system coordinate_system_is_hash_sensitive_in_principle the_field_exact_literals_are_what_the_schema_names

          - id: v0-no-confidence
            criterion: "grep -ri confidence over emitted artifacts and public types returns nothing"
            corpus: false
            oracle: false
            rust: false
            run: ci/forbidden-tokens.sh confidence

          - id: v0-c14n
            criterion: "no float in any canonical artifact; c14n rejects non-integers as a hard error"
            corpus: false
            oracle: false
            rust: true
            run: cargo test -p ethos-parser-core --locked -- c14n float quantize integers_at_the_2_53_boundary no_public_type_emits_a_decimal_number

          - id: v0-locators
            criterion: "every node carries a NativeLocator; no box is derived from a font size"
            corpus: true
            oracle: false
            rust: true
            run: cargo test -p ethos-parser-pdf --test extraction --locked -- every_run_carries_a_native_locator no_source_line_derives_a_box_from_the_font_size measured_metrics_produce_a_box_that_is_not_the_font_size a_font_without_metrics_yields_typed_absence

          - id: v0-l1-gate
            criterion: "capability and limitation declarations, including the reading-order pair"
            corpus: true
            oracle: false
            rust: true
            run: cargo test -p ethos-parser-pdf --test capabilities --locked

          - id: v0-exit-codes
            criterion: "three exit codes, one asserting fixture each, all distinguishable"
            corpus: true
            oracle: false
            rust: true
            run: cargo test --workspace --locked -- exit_zero exit_one exit_two the_three_exit_codes_are_distinguishable every_open_failure_mode_is_distinguishable the_library_refuses_what_the_binary_refuses

          # Its own job, deliberately (M7 forced decision #7). The load-bearing assertion is the
          # instrumented counter — `pages_content_scanned <= N` on a 492-page document — and the
          # wall-clock comparison sits beside it. Isolated here so a timing wobble on a shared
          # runner is legible as *this* gate rather than as an unexplained suite failure.
          # `--test-threads=1` so the timing phase is not competing with other tests.
          - id: v0-classify-bound
            criterion: "500-page at N=8 within 20% of an 8-page document at similar bytes/page"
            corpus: true
            oracle: false
            rust: true
            run: cargo test -p ethos-parser-pdf --test classification --locked -- --exact --test-threads=1 the_sampler_is_bounded_on_a_492_page_document pages_content_scanned_is_always_min_of_n_and_page_count classify_cost_is_flat_in_total_page_count

          - id: v0-fail-closed
            criterion: "unknown operator, unknown magic and unquantizable number each fail closed"
            corpus: true
            oracle: false
            rust: true
            run: cargo test --workspace --locked -- an_unknown_operator_produces_no_artifact an_unknown_operator_is_refused_by_name text_shown_before_an_unknown_operator_is_discarded_too unknown_magic_fails_closed floats_are_rejected_at_every_depth a_float_is_an_error_not_a_rounding

          - id: v0-fixture-mutation
            criterion: "mutation tests cover every fixture in the manifest"
            corpus: true
            oracle: false
            rust: true
            # --nocapture so the coverage report reaches the log: every fixture the manifest
            # declares, the mutants each took, and the pairs that could not be built. A mutation
            # job that printed only "ok" would be indistinguishable from one covering three
            # files. The count is deliberately not repeated here — the harness derives it from
            # `fixtures/manifest.json` and prints it, and a number in this comment is a number
            # nothing checks. It said 23 for long enough that the corpus reached 55 underneath it.
            run: cargo test -p ethos-parser-pdf --test robustness --locked -- --nocapture

          - id: v0-no-verify
            criterion: "no verification code, type, or field exists anywhere in the tree"
            corpus: false
            oracle: false
            rust: false
            run: ci/forbidden-tokens.sh verification

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out Ethos (fixture corpus)
        if: matrix.corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: docushell/ethos
          ref: ${{ env.ETHOS_ORACLE_REF }}
          path: ethos-oracle
          persist-credentials: false

      # The two grep criteria carry `rust: false`: they scan source text and need no compiler,
      # so they skip the toolchain and the cache entirely and finish in seconds.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        if: matrix.rust
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.rust
        with:
          workspaces: |
            .
            ethos-oracle
          # One cache per criterion would evict itself constantly; they compile the same
          # workspace, so they share.
          shared-key: v0-exit-criteria
          key: deps-opt3

      - name: Build the oracle
        if: matrix.oracle
        working-directory: ethos-oracle
        run: cargo build --release --locked --bin ethos

      - name: ${{ matrix.id }} — ${{ matrix.criterion }}
        env:
          RUSTFLAGS: "-D warnings"
          # Unset on an entry means 0 — the compile-bound default. See Cargo.toml.
          CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.optimize && 2 || 0 }}
          CARGO_PROFILE_TEST_OPT_LEVEL: ${{ matrix.optimize && 2 || 0 }}
          ETHOS_FIXTURES: ${{ github.workspace }}/ethos-oracle/fixtures
          ETHOS_BENCH_CORPUS: ${{ github.workspace }}/ethos-oracle/benchmarks/gate-zero/corpus
          ETHOS_BIN: ${{ github.workspace }}/ethos-oracle/target/release/ethos
        # No `--skip`, here or anywhere. An exclusion added to make a criterion green would
        # delete the criterion (docs/history/05-MILESTONES.md M6).
        run: ${{ matrix.run }}

  # -----------------------------------------------------------------------------------------
  # v0.1 gates — the roadmap row after v0 (docs/02-ROADMAP.md)
  # -----------------------------------------------------------------------------------------
  #
  # Deliberately a SEPARATE matrix from `v0-exit-criteria`. That one is docs/history/03-V0-SCOPE.md §5,
  # one entry per criterion, and `v0_exit_criteria.rs::every_matrix_job_is_claimed_by_a_criterion`
  # asserts every entry there is named by a §5 line. v0.1's gates are not §5 criteria — v0 is
  # frozen and its map does not move — so they live here and the two stay legible apart.
  #
  # All three need the Ethos tree. `v01-verify-relay` additionally needs the built binary: it is
  # the one suite that spawns a verifier, and its whole subject is that absence is loud rather
  # than skipped.
  v01-gates:
    # Budget (v2-S14), for the reason given on `v0-exit-criteria` above.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v01-verify-relay
            gate: "citation verification by shell-out: bytes relayed verbatim, absence is loud"
            oracle: true
            run: cargo test -p ethos-parser-cli --test verify_relay --locked

          - id: v01-encoding
            gate: "a broken font encoding is a named limitation or a named refusal, never mojibake"
            oracle: false
            run: cargo test --workspace --locked -- broken_font_encoding decodes_nothing decodes_cleanly

          - id: v01-xref-decision
            gate: "the one bounded xref repair, and everything outside it still refused"
            oracle: false
            run: cargo test --workspace --locked -- xref repaired_and_declares a_profile_that_refuses a_different_malformation never_repaired

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out Ethos (fixture corpus + CLI)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: docushell/ethos
          ref: ${{ env.ETHOS_ORACLE_REF }}
          path: ethos-oracle
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            ethos-oracle
          shared-key: v0-exit-criteria
          key: deps-opt3

      - name: Build the verifier
        if: matrix.oracle
        working-directory: ethos-oracle
        run: cargo build --release --locked --bin ethos

      - name: ${{ matrix.id }} — ${{ matrix.gate }}
        env:
          RUSTFLAGS: "-D warnings"
          ETHOS_FIXTURES: ${{ github.workspace }}/ethos-oracle/fixtures
          ETHOS_BENCH_CORPUS: ${{ github.workspace }}/ethos-oracle/benchmarks/gate-zero/corpus
          ETHOS_BIN: ${{ github.workspace }}/ethos-oracle/target/release/ethos
        run: ${{ matrix.run }}

  # -----------------------------------------------------------------------------------------
  # v1-S1 gates — the first slice of v1 (docs/history/09-V1-MILESTONES.md)
  # -----------------------------------------------------------------------------------------
  #
  # A third matrix, for the same reason v0.1 got a second one: v0's §5 map is frozen and does not
  # grow to accommodate later work. `v0_exit_criteria.rs` scopes its "every entry is claimed by a
  # criterion" assertion to the `v0-exit-criteria` block precisely so these can exist.
  v1s1-gates:
    # Budget (v2-S14), for the reason given on `v0-exit-criteria` above.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v1s1-paths
            gate: "axis-aligned path capture; curves and diagonals never become ruling lines"
            run: "cargo test -p ethos-parser-pdf --lib --locked -- content::tests"

          - id: v1s1-ruled-tables
            gate: "ruled grids, CellSlot occupancy, merged spans, and fabrication 0"
            run: "cargo test --workspace --locked -- tables:: ruled_grid cell_enclosing_no_text every_cell_text_is_built_only_from_extracted_runs implies_no_grid"

          - id: v1s1-cross-check
            gate: "geometric vs structural derivations compared; a structural disagreement refuses the grid, and the refusal is reported (v2-S20)"
            run: "cargo test --workspace --locked -- locator_cross_check two_rectangles_claiming_one_slot cross_check_rejects_is_refused build_a_cell_for_every_face the_cover_sees_no_geometry a_merged_cell_occupies"

          - id: v1s1-capability
            gate: "capabilities.tables is true, proved, and partnered by its scope limitation"
            run: "cargo test --workspace --locked -- every_true_capability_names_a_proof_test a_changed_capability_set_changes_the_artifacts_profile_hash every_false_capability_declares_a_limitation the_xref_posture"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out Ethos (fixture corpus)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: docushell/ethos
          ref: ${{ env.ETHOS_ORACLE_REF }}
          path: ethos-oracle
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            ethos-oracle
          shared-key: v0-exit-criteria
          key: deps-opt3

      - name: ${{ matrix.id }} — ${{ matrix.gate }}
        env:
          RUSTFLAGS: "-D warnings"
          ETHOS_FIXTURES: ${{ github.workspace }}/ethos-oracle/fixtures
          ETHOS_BENCH_CORPUS: ${{ github.workspace }}/ethos-oracle/benchmarks/gate-zero/corpus
        run: ${{ matrix.run }}

  # -----------------------------------------------------------------------------------------
  # v1-S7 — the table gate (docs/table-gate-v1.md)
  # -----------------------------------------------------------------------------------------
  #
  # **The gate is currently MISSED — macro cell-F1 43‰ against a 489‰ floor — and this job runs
  # anyway.** It is deliberately not `#[ignore]`d and does not skip the score: a gate that stops
  # being computed the moment it goes red is a gate nobody can tell is red.
  #
  # What it asserts today:
  #
  #   - fabrication is **0** across the four real documents (the one number with a required value)
  #   - the measurement reruns to the same value
  #   - the gold negatives still yield no geometric table
  #   - the cell-F1 verdict is recorded, and CLEARING the floor fails the build so the milestone
  #     documents cannot fall out of step with the number
  #
  # `--nocapture` so the CI log carries the table itself rather than only the fact that nothing
  # failed. When the gate is cleared, `the_cell_gate_is_measured_and_its_verdict_is_recorded`
  # inverts to a floor assertion and this comment goes with it.
  v1s7-table-gate:
    # Budget (v2-S14), for the reason given on `v0-exit-criteria` above.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    # The one labelling job that is runtime-bound rather than compile-bound: `accuracy::` is the
    # 236.6s-vs-44.9s suite Cargo.toml's table measures. It buys back far more than the compile.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 2
      CARGO_PROFILE_TEST_OPT_LEVEL: 2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v1-table-gate
            gate: "cell-F1 computed and reported; fabrication 0; stable; gold negatives clean"
            run: "cargo test -p ethos-parser-pdf --lib --locked -- --nocapture accuracy::"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out Ethos (fixture corpus)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: docushell/ethos
          ref: ${{ env.ETHOS_ORACLE_REF }}
          path: ethos-oracle
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            ethos-oracle
          shared-key: v0-exit-criteria
          key: deps-opt3

      - name: ${{ matrix.id }} — ${{ matrix.gate }}
        env:
          RUSTFLAGS: "-D warnings"
          ETHOS_FIXTURES: ${{ github.workspace }}/ethos-oracle/fixtures
          ETHOS_BENCH_CORPUS: ${{ github.workspace }}/ethos-oracle/benchmarks/gate-zero/corpus
        run: ${{ matrix.run }}

  # Which paths a pull request touched, so `v0-fuzz-smoke` can run on parser changes and sit out
  # a docs-only PR. A `git diff` rather than a third-party path-filter action: it is five seconds,
  # it adds no supply-chain surface to a workflow whose whole posture is `contents: read`, and it
  # reads the same way the DCO check below does.
  #
  # Always runs, and reports `false` on any event that is not a pull request. That keeps
  # `v0-fuzz-smoke`'s condition a plain OR instead of needing `always()` to survive a skipped
  # dependency.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parser: ${{ steps.filter.outputs.parser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Does this change reach the parser?
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "parser=false" >> "$GITHUB_OUTPUT"
            echo "not a pull request; the fuzz smoke runs on its weekly schedule instead"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only "$base" "$head")"
          echo "$files"
          # `fuzz/` builds against the engine sources, so anything under crates/ can break a
          # target, and the manifests/toolchain decide what it is built with.
          if echo "$files" | grep -qE '^(crates/|fuzz/|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)'; then
            echo "parser=true" >> "$GITHUB_OUTPUT"
          else
            echo "parser=false" >> "$GITHUB_OUTPUT"
          fi

  # -----------------------------------------------------------------------------------------
  # §5: `cargo-fuzz` target exists and runs clean on the corpus
  # -----------------------------------------------------------------------------------------
  #
  # Its own job because it is the one thing here that needs nightly: `cargo-fuzz` builds with
  # `-Z sanitizer=address`, which stable does not accept. Nightly is installed **only** in this
  # job — the workspace MSRV stays 1.88 and every other job compiles with it.
  #
  # A short budget on purpose. This is a gate against panics on inputs shaped like the corpus,
  # not a fuzzing campaign: 60s per *running* target catches a crash a refactor introduced, and
  # finding the deep bugs is a job for a long-running fuzzer outside PR latency. `-timeout=10`
  # fails an input that hangs rather than letting the job burn its wall clock on one pathological
  # file. Three targets are built here and two are run; the step below says why.
  #
  # `fuzz/` is excluded from the workspace, so this compiles a separate crate against the same
  # engine sources and `cargo deny check` never sees `libfuzzer-sys`.
  v0-fuzz-smoke:
    # Budget (v2-S14). 120 seconds of fuzzing cost ~7 billed minutes a run, because the job
    # installs nightly and cargo-fuzz and builds three targets before it executes an input. Its
    # own comment above calls it a panic gate rather than a campaign, so it runs weekly, and on
    # any pull request that actually reaches the engine. `if:` rather than deletion:
    # `v0_exit_criteria.rs::every_named_job_exists_in_the_workflow` requires this id to be here,
    # because §5 names it.
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.parser == 'true'
    name: v0-fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **Installing nightly is not the same as using it**, and this job spent every run it ever
    # had proving the difference. `dtolnay/rust-toolchain@nightly` sets the rustup *default*,
    # and `rust-toolchain.toml` outranks the default on every cargo invocation — the same
    # mechanism the `check` job documents above. `fuzz/` carries no toolchain file of its own,
    # so rustup walks up to the root pin and hands `cargo fuzz` a stable 1.88.0, which rejects
    # `-Zsanitizer=address` as a nightly-only option and fails before a single input is run.
    #
    # `RUSTUP_TOOLCHAIN` outranks the toolchain file, so it is what actually selects nightly
    # here. Set on the job rather than on the three cargo steps: a fourth step added later
    # would silently inherit the bug otherwise, which is precisely how `office_read` came to
    # sit in the tree with nothing compiling it.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned by SHA like every other action here, with ONE difference that matters:
      # `dtolnay/rust-toolchain` selects the toolchain from the REF NAME when no
      # `toolchain:` input is given. Every other call site in this file passes
      # `toolchain: "1.88.0"` explicitly, so pinning `@master` changes nothing. This one
      # did not, so pinning the SHA alone would leave no toolchain named and the action
      # would fall back to `rust-toolchain.toml` — silently building this fuzz job on
      # stable 1.88, which `cargo-fuzz` cannot use. The input is therefore stated.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch, 2026-09-24
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./fuzz
          shared-key: fuzz

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz

      # Build every target first: a target that no longer compiles against the engine API is the
      # most likely way this rots, and it is worth failing on that before spending any budget.
      #
      # **`office_read` is built and not run, and the asymmetry is deliberate.** v2-S12 measured
      # the cost of a per-push office campaign and declined it — a 60-second run buys ~66,000
      # executions against a corpus CI rebuilds from the sixteen seeds every time, which is under
      # 2% of that slice's campaign. That decision stands. But *building* costs ~50 s on a job
      # that already installs nightly and `cargo-fuzz`, and it buys the one thing that was
      # missing: `cargo build --workspace` excludes `fuzz/`, so before v2-S12.1 nothing in the
      # repository compiled `office_read` at all. It could have stopped building and every job
      # would have stayed green.
      # **`cargo fuzz` defaults `--target` to its own binary's triple, not the runner's.**
      # `taiki-e/install-action` installs a prebuilt through cargo-binstall and the Linux
      # prebuilt is musl-linked, so `cargo fuzz` asked for `x86_64-unknown-linux-musl` on a gnu
      # host and the build died twice over: ASan refuses a statically linked libc ("sanitizer is
      # incompatible with statically linked libc"), and no musl std is installed to compile
      # against ("can't find crate for `core`"). Neither error mentions the target, which is why
      # this took a second look to find.
      #
      # Read from `rustc -vV` rather than written out here, so it follows the runner instead of
      # pinning a triple that a later `runs-on` change would quietly invalidate.
      - name: Resolve the host triple
        run: |
          echo "FUZZ_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Build the fuzz targets
        working-directory: fuzz
        run: |
          cargo fuzz build open_and_classify --target "$FUZZ_TARGET"
          cargo fuzz build open_and_extract --target "$FUZZ_TARGET"
          cargo fuzz build office_read --target "$FUZZ_TARGET"

      - name: Seed the corpora
        run: |
          ./fuzz/seed-corpus.sh open_and_classify
          ./fuzz/seed-corpus.sh open_and_extract

      - name: Fuzz open_and_classify
        working-directory: fuzz
        run: cargo fuzz run open_and_classify --target "$FUZZ_TARGET" -- -max_total_time=60 -timeout=10 -max_len=65536

      - name: Fuzz open_and_extract
        working-directory: fuzz
        run: cargo fuzz run open_and_extract --target "$FUZZ_TARGET" -- -max_total_time=60 -timeout=10 -max_len=65536

      # A crash file is the whole point of the job, so make it retrievable rather than only
      # visible as a red tick.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # -----------------------------------------------------------------------------------------
  # §5: mutation tests cover every fixture — the office half (v2-S13)
  # -----------------------------------------------------------------------------------------
  #
  # `v0-fixture-mutation` covers every fixture in `fixtures/manifest.json`, all 55 of which are
  # PDFs. The sixteen office packages are in no manifest, so that job cannot reach them; this is
  # `A11`'s mutation lane for the other eight formats.
  #
  # **A top-level job rather than a fifteenth entry in the `v0-exit-criteria` matrix, and that is
  # forced rather than chosen.** `crates/ethos-parser-cli/tests/v0_exit_criteria.rs` asserts that matrix
  # is exactly fourteen entries — §5 is fifteen criteria across fourteen jobs because the fuzz and
  # mutation criterion names two — and v0 is frozen, so that number does not move for v2 work. §5's
  # mutation line names this job as a third, which keeps the criteria count at fifteen and lets
  # `every_named_job_exists_in_the_workflow` assert this block exists.
  #
  # No corpus checkout: `fixtures/office/` is engine-owned and committed here, unlike the Ethos
  # conformance corpus. Nothing to clone, so this is the cheapest job in the file.
  v0-office-mutation:
    # The weekly `schedule` trigger exists for `v0-fuzz-smoke` alone; nothing else runs on it.
    if: github.event_name != 'schedule'
    name: v0-office-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: v0-exit-criteria
          key: deps-opt3

      # --nocapture so the coverage report reaches the log, for the same reason
      # `v0-fixture-mutation` carries it: a mutation job that printed only "ok" would be
      # indistinguishable from one covering three files. The report names every fixture, the
      # mutations each took, and every pair that could not be built.
      - name: Mutate every office fixture
        run: cargo test -p ethos-parser-office --test robustness --locked -- --nocapture

  # Forced decision #14 ("no AGPL") is only real if it is tested. A policy nobody proves is a
  # policy that has already drifted.
  #
  # The probe flips a workspace crate's own licence field rather than pulling a third-party
  # AGPL crate. That keeps the proof self-contained: it cannot break because an upstream crate
  # relicensed, went yanked, or changed its feature graph, and it needs no network.
  #
  # It uses the same cargo-deny version and the same invocation as the gate above, so what is
  # proven here is what actually runs on a PR.
  deny-policy-is-enforced:
    # The weekly `schedule` trigger exists for `v0-fuzz-smoke` alone; nothing else runs on it.
    if: github.event_name != 'schedule'
    name: deny rejects AGPL (proof, not assumption)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Baseline — the gate passes as committed
        run: cargo deny check licenses

      - name: Flip a crate to AGPL-3.0 and require rejection for the right reason
        run: |
          set -euo pipefail
          sed -i 's/^license.workspace = true/license = "AGPL-3.0"/' crates/ethos-parser-core/Cargo.toml
          grep -q 'AGPL-3.0' crates/ethos-parser-core/Cargo.toml || {
            echo "::error::probe did not apply; the licence gate was never exercised"; exit 1; }

          set +e
          out="$(cargo deny check licenses 2>&1)"
          code=$?
          set -e
          echo "$out"

          # Any non-zero exit would be "cargo-deny was unhappy" — a config typo or a network
          # blip would pass for proof. Require the licence-rejection exit code (4) AND the
          # crate name in the diagnostic, so this proves the gate fired for THIS reason.
          [ "$code" -eq 4 ] || {
            echo "::error::expected cargo-deny exit 4 (licence rejection), got $code"; exit 1; }
          echo "$out" | grep -q 'ethos-parser-core' || {
            echo "::error::cargo-deny failed, but not about ethos-parser-core's licence"; exit 1; }
          echo "cargo deny correctly rejected AGPL-3.0 on ethos-parser-core (exit 4)."

      # Safe in CI because the runner checks out a clean tree. Do NOT run this probe by hand in a
      # working tree with uncommitted changes: `git checkout --` restores the COMMITTED file and
      # silently discards them. To reproduce locally, stash first or copy the file aside.
      - name: Restore and confirm the tree is clean
        if: always()
        run: |
          git checkout -- crates/ethos-parser-core/Cargo.toml
          git diff --exit-code

  # DCO (mirrors the Ethos rule): every commit in the pushed or proposed range carries a
  # Signed-off-by trailer. `.githooks/commit-msg` enforces the same thing locally through the
  # same `git interpret-trailers` parse, so a commit that passes the hook passes here.
  dco:
    # The weekly `schedule` trigger exists for `v0-fuzz-smoke` alone; nothing else runs on it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: check DCO sign-offs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/check_dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            python3 .github/scripts/check_dco.py "${{ github.event.before }}" "${{ github.sha }}"
          fi

  # -----------------------------------------------------------------------------------------
  # Plan item 6.1, the operating-system axis: one set of inputs, three systems, one set of bytes
  # -----------------------------------------------------------------------------------------
  #
  # `docs/measurements/cross-architecture/` settled the instruction-set axis on one Mac — aarch64
  # against x86_64, 412 comparisons, 0 mismatches — and says in its own §4 that it licenses nothing
  # about Linux or Windows. A filesystem, a path separator, a line ending and a core count all
  # belong to the machine, and none of them varied there. These two jobs are the other half.
  #
  # `cross-os-digests` builds the release engine on each system and runs `ci/artifact-bytes.py`
  # there. `cross-os-identity` then requires the three digest lists to be byte-identical, and
  # `diff` names the document and the artifact of any row that moved.
  #
  # **The inputs: 84 documents, 336 digests** (66 and 264 when the job was written, at 5bb78db;
  # 81 and 324 at its first run, 2026-09-18, which passed).
  # Every engine and office fixture, plus six of the eight gate PDFs. The gate PDFs are the only
  # real-world documents in the tree — compressed streams, embedded fonts, structure trees, up to
  # 183 pages, so the page-parallel extract runs at each runner's own core count.
  # `nist-sp-800-53Ar5` and `nist-sp-800-161r1` are left out by name: measured locally at 5bb78db
  # they take three times as long as the other 64 documents together, and 53Ar5's extract peaks at
  # 3.6 GiB against a macOS runner's 7 GB. `ci/release-artifacts.sh` leaves the same two out of its
  # projections. The Ethos conformance corpus is not read, because it would bring a second
  # repository's checkout, and its line endings, into a comparison of this one's bytes.
  #
  # **Not in `ci/gate.sh`, and it cannot be:** one host runs one leg, and one leg compares nothing.
  # `the_local_gate_runs_what_ci_runs` compares that script with the `check` job's steps and the two
  # `ci/forbidden-tokens.sh` greps, and with no other job.
  #
  # **Unverified until it runs.** Written without a runner to try it on. Windows is the leg most
  # likely to fail for a reason other than the engine; `.gitattributes` and `ci/artifact-bytes.py`
  # each say what they already changed for it.
  cross-os-digests:
    # The weekly `schedule` trigger exists for `v0-fuzz-smoke` alone; nothing else runs on it.
    if: github.event_name != 'schedule'
    name: cross-os-digests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Not a measurement: a guess, since no runner has built this yet. Locally the release build
    # (LTO, one codegen unit) takes 1m08s on 14 cores and the digest run 25s.
    timeout-minutes: 60
    strategy:
      # One system failing still leaves the other lists uploaded to read.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Git Bash on Windows, so each step is one script on all three systems.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installed and asserted as `check` does, for the reasons given there.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch, 2026-09-24
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deps-opt3

      - name: Assert the toolchain pin is in force
        run: |
          set -euo pipefail
          want="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' rust-toolchain.toml | head -1)"
          got="$(cargo --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "rust-toolchain.toml wants $want; cargo reports $got"
          [ "$want" = "$got" ] || { echo "::error::toolchain pin not in force"; exit 1; }

      # One interpreter version on all three, and `python` rather than `python3`, which a Windows
      # runner does not reliably provide.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the engine
        run: cargo build --release --locked

      - name: Digest every artifact
        run: python ci/artifact-bytes.py --without nist-sp-800-53Ar5 --without nist-sp-800-161r1 > "digests-${{ matrix.os }}.sha256"

      # `overwrite`, so re-running every job does not fail on the name the first attempt uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.os }}
          path: digests-${{ matrix.os }}.sha256
          if-no-files-found: error
          overwrite: true

  cross-os-identity:
    # Runs only when all three legs succeeded: an `if:` with no status function implies success().
    if: github.event_name != 'schedule'
    needs: cross-os-digests
    name: cross-os byte identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      # **Identical is not enough.** Three builds that refuse every input agree perfectly, and so do
      # three that print nothing, so each list must also carry a floor of real artifacts: a row
      # that exited 0 with non-empty output. 332 of the 336 rows are that since decision #29's
      # three heading fixtures (320 of 324 before them); the other four are `tagged-cycle`, whose
      # extract is refused by design, and its three projections. The floor is one document short of
      # 332 — losing any document's four artifacts reads 328 and fails. Adding a fixture never trips it; removing one, or another extract being refused,
      # does, and moving the number is then a decision rather than a drift.
      - name: Three systems, one set of bytes
        working-directory: digests
        env:
          # sha256 of zero bytes.
          EMPTY: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          MIN_PRODUCED: "329"
        run: |
          set -euo pipefail
          lists=(digests-*.sha256)
          if [ "${#lists[@]}" -ne 3 ]; then
            echo "::error::expected three digest lists, found ${#lists[@]}: ${lists[*]}"
            exit 1
          fi

          fail=0
          for list in "${lists[@]}"; do
            rows="$(wc -l < "$list")"
            produced="$(awk -v empty="$EMPTY" '$NF == "exit=0" && $1 != empty { n++ } END { print n + 0 }' "$list")"
            echo "$list: $rows rows, $produced non-empty artifacts"
            if [ "$produced" -lt "$MIN_PRODUCED" ]; then
              echo "::error::$list carries $produced non-empty artifacts; the floor is $MIN_PRODUCED"
              fail=1
            fi
            # A crash, not a refusal. The engine's own exit codes are 0-255; a killed process is a
            # negative signal number on Linux and macOS and an NTSTATUS above 255 on Windows, so the
            # same crash on all three systems would otherwise surface only as a diff between them.
            crashed="$(awk '$NF != "exit=-" && !($NF ~ /^exit=[0-9]+$/ && substr($NF, 6) + 0 <= 255)' "$list")"
            if [ -n "$crashed" ]; then
              echo "::error::$list: the engine crashed rather than exiting on the rows below"
              echo "$crashed"
              fail=1
            fi
          done

          for list in "${lists[@]:1}"; do
            if ! diff "${lists[0]}" "$list"; then
              echo "::error::${lists[0]} and $list differ"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] && echo "byte-identical across ${lists[*]}"
          exit "$fail"
