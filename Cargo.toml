# `OdtLocator.paragraph` counts blocks IN THE FILE, including the ones inside a footnote or a
# comment this slice does not read. A reader that numbered only what it kept would put every
# citation after a footnote on the wrong paragraph.
#
# NO NEW DEPENDENCY. The same `ethos-parser-office`, the same hand-rolled ZIP over `flate2`, the same
