# THIS IS THE FORMAT THAT TESTED THE LAW RATHER THAN EXTENDING IT. A DOCX has no page until a
# renderer invents one and a spreadsheet's page is a printer's, but a SLIDE IS REAL: discrete,
# listed in the package, and counted out loud. Both routes to calling it a page are refused —
# `p:sldSz` is a size nothing measured against, and a position in `<p:sldIdLst>` is display order
# that changes when a deck is reordered. `pages` is `[]` and the locator carries NO SLIDE NUMBER.
#
# TWO MEASUREMENTS CHANGED THE DESIGN BEFORE IT SHIPPED. Shape ids are not unique in real decks
# (12 of 329 measured slides reuse one, and PowerPoint opens them), so the address is a position
# and the id is a label. And `<mc:Fallback>` duplicates its sibling `<mc:Choice>`, so reading both
# would emit one phrase twice at two addresses — the mirror of a silent drop.
#
# NO NEW DEPENDENCY. The same `ethos-parser-office`, the same hand-rolled ZIP over `flate2`, the same
# `quick-xml`. What moved is internal: the `r:id`-to-part rule to `opc.rs` and the XML plumbing to
# `xml.rs`, because a third copy of a rule is how two copies of it start disagreeing.
