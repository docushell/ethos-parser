# **Publication is refused by default, and turning it on is the deliberate act.**
#
# `CHANGELOG.md` has said from its third line that nothing here is tagged or published and that a
# release is "a separate, deliberate act". That was prose, and prose does not stop `cargo publish`.
# Nothing did: every crate carries the `description` and `license` crates.io requires, `cargo
# package` succeeds, and the names `ethos-parser-*` were one command away from being claimed
# permanently by anybody who ran it in this directory.
#
# A publish is the one action in this repository that cannot be undone — `cargo yank` stops new
# dependents resolving a version and leaves the number spent and the files downloadable, and there
# is no unpublish. So the default is `false` and `docs/RELEASING.md` §5.4 says to remove it on
# purpose, at the moment of release, as a tracked edit somebody reviews. **The friction is the
# point**: it converts a sentence in a changelog into something a person has to mean.
publish = false

[workspace.dependencies]
# Dependencies are constrained by deny.toml: permissive licences only, no AGPL, no network.
# Additions are reviewed against docs/04-ARCHITECTURE.md §5.
#
# M0 declares only what the oracle harness needs. `lopdf`, `ttf-parser`, `serde` and `clap`
# arrive with the milestones that use them (M1-M3), not before.
sha2 = "0.10"
# 0.39.0: page-parallel extraction. MIT/Apache-2.0 through its whole tree, no network,
# no unsafe API surface — reviewed against deny.toml's allowlist before addition.
rayon = "1.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# dev-only
proptest = "1"

# internal
ethos-parser-core = { path = "crates/ethos-parser-core", version = "0.46.0" }
ethos-parser-pdf = { path = "crates/ethos-parser-pdf", version = "0.46.0" }
ethos-parser-office = { path = "crates/ethos-parser-office", version = "0.46.0" }
ethos-parser-grounding = { path = "crates/ethos-parser-grounding", version = "0.46.0" }

# Tests are the CI budget, and they were compiling unoptimized.
#
# Two separate effects, measured at v2-S14 on `accuracy::` — the table gate, the most expensive
# suite in the tree — with dependencies warm and only workspace crates rebuilt:
#
#     workspace  deps  |  workspace compile  |  accuracy::
#             0     0  |               8s    |    236.6s
#             0     3  |               8s    |     44.9s
#             2     2  |              27s    |     15.8s
#
# Optimizing DEPENDENCIES is 5.3x and free: `Swatinem/rust-cache` restores them, so the cost is
# paid on a cache miss rather than per job. That is this block.
#
# Optimizing WORKSPACE crates buys the remaining 3x and triples their compile — and workspace
# crates are the half rust-cache deliberately discards, because they change every commit. So the
# nineteen labelling jobs, which are compile-bound and barely run a test, would pay that three
# times over to save seconds. The first attempt at this set both and CI measured the result: the
# two heavy jobs won 54 minutes and the nineteen light ones gave back 48.
#
# So workspace opt-level stays 0 here, and the three runtime-bound jobs raise it for themselves
# through `CARGO_PROFILE_*` in .github/workflows/ci.yml. Local `cargo build` stays fast too.
#
# `debug-assertions` is untouched and stays ON, so overflow checks and every `debug_assert!`
# still run. This buys wall-clock, not laxity.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
