# is silent — one reader gaining `<text:page-count>` and the other not puts a word processor's page
# arithmetic in one artifact and not the other, with nothing failing.
#
# THE FRAME-ALTERNATIVE RULE IS NOW MEASURED. v2-S5 wrote first-rendition-wins off the specification
# and recorded that it had never met a document nesting two renditions, because it had none. This
# slice authors one: ODF puts `<draw:frame>` in the `<text:p>` content model for every document
# type, so a spreadsheet cell can hold two `<draw:text-box>` children. One is read, the other is
# declared, and the node is NOT the concatenation.
#
# THE `%PDF-` DEFECT S5 DEFERRED IS CLOSED. An `.ods` used to fall past the office branch and be
# refused for having no PDF header — fail-closed, wrong cause. The CLI now asks the ODF FAMILY
# question (`is_opendocument`), and `read` refuses a declared type it does not implement by name. An
# `.odp` says so about itself.
#
# NO NEW DEPENDENCY. The same `ethos-parser-office`, the same hand-rolled ZIP over `flate2`, the same
# `quick-xml` — no `zip`, no `calamine`, no ODF crate, no LibreOffice. `Profile::ods_v0` has its own
# hash, six profiles are now mutually distinct, and this hash moves on `parser_version` ALONE.
#
# WHAT COULD NOT BE MEASURED IS RECORDED, again: no corpus of real `.ods` files was available and no
# ODF producer was either. Every rule is read off the specification and pinned against packages this
# repository authors byte by byte.
#
# S6 is ODS and is done; S7 still parks ODP, RTF, EPUB and CSV. v2's gate is still a DOCX quote and
# an XLSX cell; this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and
# the 0.489 chase is STILL parked.
#
# **0.26.0 is v2-S7: an ODP BLOCK binds, and the page that was free stays out.** OpenDocument
# presentations enter the representation — `content.xml`'s `<draw:page>` shapes and their
# `<text:p>` blocks — and the reason this is a slice is the refusal rather than the reader.
#
# THE PAGE WAS FREE HERE. Every page-less format before this one had to ARGUE that its page was
# somebody else's: a DOCX has none until a renderer picks one, a workbook's is a printer's, a PPTX
# slide is a PART, an ODT's soft page break is a word processor's arithmetic. A presentation needs
# no argument at all — `<draw:page>` elements are discrete, listed, ordered and named, a
# `<style:master-page>` states `fo:page-width` beside them, and a `PageRecord` would need NO
# ARITHMETIC. It is refused anyway, on `docs/06-STEAL-REFUSE.md` L30's own three words: "It invents
# pagination." (This said FOUR from v2-S7 until v2-S14.1. It never rotted: `git log -S` shows the
# quoted phrase has never changed, so it was miscounted once and copied to five other files.) A
# draw page is a part of the presentation's structure, not a page this engine measured. `pages`
# stays `[]`, and `OdpLocator { part, draw_page, shape, paragraph }` carries a
# POSITION named for the element rather than for what it resembles — `deny_unknown_fields` refuses
# `page`, `bbox`, `x`, `slide_number` and `soft_page_break` by name.
#
# THE NAMES ARE LABELS, on v2-S4's measured precedent. `draw:name` on a page and on a shape is
# optional in ODF and could not be measured unique, because no corpus of real `.odp` files was
# available — so it goes on the attributes, where `<p:cNvPr id>` went when S4 measured it across 18
# real decks and found it unique only most of the time.
#
# THE FRAME RULE, MEASURED A THIRD TIME, AND THE ATOM IS AGAIN WHAT DECIDES. v2-S5 read
# first-rendition-wins off the specification; v2-S6 measured it on a spreadsheet and found that a
# frame floats over the SHEET, so both renditions are erasures. A presentation is a drawing and
# there is nothing to float over: the frame IS the shape this reader addresses, so the first
# rendition becomes nodes — ODT's outcome, reached by neither ODT's nor ODS's argument.
#
# ONE ALLOWLIST, STILL NOT TWO. `odt.rs`'s `Element`, `classify`, namespaces and block engine are
# imported for the third reader. What this format added was a silent drop none of the others had:
# `<draw:frame><draw:image><svg:title>` contains no `<text:p>` at all, so a per-block foreign
# counter never sees it. Counted at the SHAPE now.
#
# NO NEW DEPENDENCY. `Profile::odp_v0` has its own hash, seven profiles are now mutually distinct,
# and this hash moves on `parser_version` ALONE.
#
# S7 is ODP and is done; S8 parks RTF, EPUB and CSV. v2's gate is still a DOCX quote and an XLSX
# cell; this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and the 0.489
# chase is STILL parked.
