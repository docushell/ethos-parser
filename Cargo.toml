# a flag on the ODT reader. SpreadsheetML writes `<c r="B12">` and `XlsxLocator` READS it. ODF
# writes NO address at all: a cell's position is where it sits among its siblings, and a run of
# identical cells is compressed into `table:number-columns-repeated="n"`. So the repeats ARE the
# statement of position, honouring them is reading, and the column is a NUMBER because the file
# contains no letters — `B` is a spreadsheet application's convention, not a string this document
# holds.
