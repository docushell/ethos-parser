# ethos-engine workspace.
#
# Four crates, decided (docs/04-ARCHITECTURE.md §1). A fifth crate before a second format is
# speculative structure; revisit only when office or OCR needs a real home.
#
# Boundary rules, enforced in review:
#   engine-core       — no PDF concept
#   engine-pdf        — no grounding concept
#   engine-grounding  — no PDF concept
#   engine-cli        — no logic

[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-pdf",
    "crates/engine-grounding",
    "crates/engine-cli",
]
# `fuzz/` is a cargo-fuzz package, not a member (M7). Excluding it keeps `libfuzzer-sys` — a
# nightly-only sanitizer shim — out of the workspace dependency graph, which is what `cargo deny
# check` inspects and what `cargo build --workspace` compiles. The fuzz crate depends on the
# engine; nothing in the engine depends on it. See `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[workspace.package]
# v0.1 (0.2.0). `parser_version` is read from this (`Profile::default`), so the bump is an
# identity event: `profile_sha256` moves, and every artifact produced before and after is
# correctly non-comparable. That is the design, not a regression — see CHANGELOG.
#
# The version number leads the roadmap label by one minor: v0 shipped as 0.1.0 (M7), the "v0.1"
# roadmap row shipped as 0.2.0, and v1's slices ship one minor each — S1 as 0.3.0, S2 as 0.4.0,
# S3 as 0.5.0, S4 as 0.6.0, S5 as 0.7.0, S6 as 0.8.0, the S6 repair slices as 0.8.1 and 0.8.2,
# and S7a/S7b as 0.9.0.
#
# **0.9.0 is not a detector change.** S7b set out to move `unruled::COLUMN_GUTTER_MIN` and
# measured that no value of it changes any number on the corpus, so no rule id moved and
# `table_detection` is still `unruled-align-v1`. The hash moves because `parser_version` does.
# See CHANGELOG and docs/table-gate-v1.md.
#
# v1 itself is not done — the S7 cell gate is measured and MISSED (43‰ against a 489‰ floor) —
# so this is not 1.0.0 and will not be until docs/09-V1-MILESTONES.md S7 is green.
version = "0.9.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/docushell/ethos-engine"
authors = ["ethos-engine maintainers"]

[workspace.dependencies]
# Dependencies are constrained by deny.toml: permissive licences only, no AGPL, no network.
# Additions are reviewed against docs/04-ARCHITECTURE.md §5.
#
# M0 declares only what the oracle harness needs. `lopdf`, `ttf-parser`, `serde` and `clap`
# arrive with the milestones that use them (M1-M3), not before.
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# dev-only
proptest = "1"

# internal
engine-core = { path = "crates/engine-core", version = "0.9.0" }
engine-pdf = { path = "crates/engine-pdf", version = "0.9.0" }
engine-grounding = { path = "crates/engine-grounding", version = "0.9.0" }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
