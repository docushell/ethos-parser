# ethos-parser workspace.
#
# Five crates as of v2-S2 (docs/04-ARCHITECTURE.md §1). The fifth was refused until a second
# format existed — "a fifth crate before a second format is speculative structure" — and DOCX is
# that format, so `ethos-parser-office` stops being speculative and starts being the only place OOXML
# may live.
#
# Boundary rules, enforced in review:
#   ethos-parser-core       — no PDF concept, and no OOXML concept
#   ethos-parser-pdf        — no grounding concept
#   ethos-parser-office     — no PDF concept, no grounding concept (OOXML and ODF both live here)
#   ethos-parser-grounding  — no format concept — it projects the representation, never a document
#   ethos-parser-cli        — no logic

[workspace]
resolver = "2"
members = [
    "crates/ethos-parser-core",
    "crates/ethos-parser-pdf",
    "crates/ethos-parser-office",
    "crates/ethos-parser-grounding",
    "crates/ethos-parser-cli",
]
# `fuzz/` is a cargo-fuzz package, not a member (M7). Excluding it keeps `libfuzzer-sys` — a
# nightly-only sanitizer shim — out of the workspace dependency graph, which is what `cargo deny
# check` inspects and what `cargo build --workspace` compiles. The fuzz crate depends on the
# engine; nothing in the engine depends on it. See `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[workspace.package]
# v0.1 (0.2.0). `parser_version` is read from this (`Profile::default`), so the bump is an
# identity event: `profile_sha256` moves, and every artifact produced before and after is
# correctly non-comparable. That is the design, not a regression — see CHANGELOG.
#
# The version number leads the roadmap label by one minor: v0 shipped as 0.1.0 (M7), the "v0.1"
# roadmap row shipped as 0.2.0, and v1's slices ship one minor each — S1 as 0.3.0, S2 as 0.4.0,
# S3 as 0.5.0, S4 as 0.6.0, S5 as 0.7.0, S6 as 0.8.0, the S6 repair slices as 0.8.1 and 0.8.2,
# S7a/S7b as 0.9.0, S8 as 0.10.0, v1.1-S0/S1 as 0.11.0, v1.1-S2 as 0.12.0, v1.1-S3 as 0.13.0, v1.1-S4 as 0.14.0, its repair as 0.14.1, v1.2-S0/S1 as 0.15.0, v1.2-S2 as 0.16.0, v1.2-S3 as 0.17.0, v1.2-S4 as 0.18.0, v1.2-S5 as 0.19.0, v2-S1 as 0.20.0, v2-S2 as 0.21.0, v2-S3 as 0.22.0, v2-S4 as 0.23.0, v2-S5 as 0.24.0, v2-S6 as 0.25.0, v2-S7 as 0.26.0, v2-S8 as 0.27.0, v2-S9 as 0.28.0, its counter repair as 0.28.1, v2-S10 as 0.29.0, its documentation repair as 0.29.1, v2-S11 as 0.30.0, v2-S12 as 0.31.0, its guard repair as 0.31.1, v2-S13 as 0.32.0, its guard repair as 0.32.1, the roadmap reorder as 0.32.2, its prose repair as 0.32.3, the owner's two gate decisions as 0.32.4, the two sweeps that never ran as 0.32.5, the CRC-32 answer as 0.33.0 — a MINOR, because it changes a reader — the guards those sweeps named and did not write as 0.33.1, the `neither detector` cluster as 0.34.0 — a MINOR, because two of its sites are emitted wire strings and an artifact this build writes differs from one 0.33.1 wrote for the same bytes — the no-behaviour-change extractor four slices rebuilt by hand as 0.34.1, the two guards outside `src` as 0.34.2, the gate that has never been green as 0.34.3, the corpus that was never grown as 0.35.0 — a MINOR, because it moves the mutation corpus off its pinned counts and re-measures the table gate on three times the documents — the nine grids the engine already rejects as 0.36.0, the mutation that missed as 0.36.1, why ten documents produce nothing as 0.36.2, the coverage two slices retired as 0.36.3, and the tagged tables the documents declare as 0.37.0 — a MINOR, because a reader changed: the PDF extractor now emits a table for each `/Table` the structure tree declares that no geometric detector matched, with geometry typed-absent, so a NIST document gains tables on the artifact where 0.36.3 emitted none, and the emit path that built every artifact twice as 0.37.1 — a PATCH, because output bytes are identical at equal version: canonical serialization streams instead of building a `serde_json::Value` tree, fonts parse once per document instead of once per page, and the run buffers move instead of cloning. The detector quadratics went the same way as 0.37.2 — a PATCH on the same proof: the ruled coherence scan, the lattice line lookups, the overlap check, and the unruled line lookup keep their exact semantics at lower complexity, and the gate artifacts are byte-identical at equal version. Numeric character references and the shared format router landed as 0.38.0 — a MINOR, because six readers changed: the office XML readers resolve `&#233;` where they refused it, six `text_code_rule` ids move to v2 with the behaviour, and the MCP surface routes through the same dispatch as the CLI. The clustering lead was measured and refused as 0.38.1 — a PATCH that changes no reader: the audit's per-component ruled rule was implemented, run against the gate, and reverted on its numbers, and the measurement is the slice. Pages went parallel as 0.38.2 — a PATCH carrying the workspace's first threading dependency: every gate artifact is byte-identical, ids, holes, and first-error semantics included, and the fold that proves it is the commit's whole story. The emit tail followed as 0.38.3: seal keeps the canonical payload bytes it hashed and the print splices them into the envelope, so the payload is walked once per artifact instead of twice — byte-identical again, and measured. The office formats stopped being stranded as 0.39.0 — a MINOR, because the emitter changed: the Ethos-side schema revision the page-less refusal waited on landed as ethos.grounding.v1 1.1.0, engine ground projects office representations into its page-less shape, and a DOCX quote verifies end to end across the estate. A node whose kind has no ink box stopped refusing to seal at 0.40.0 — a MINOR, because six fixtures' artifacts move: the geometry declaration now fires for annotations, form fields and images as `check_structure` always demanded, and the ink sentence's denominator counts text nodes on both sides. The assurance envelope started enforcing its own invariant on the way IN at 0.40.1 — a PATCH: nothing this engine emits changes, and a forged record claiming completion its pages contradict is refused where it used to be read. The overlay note started counting tagged tables at 0.40.2 — a PATCH on the overlay's own output: a page holding two of them said it held none, and said nothing was undrawable. The engine became `ethos-parser` at 0.41.0 — a MINOR, because every wire-visible name it emits moved with it: the ten `ethos.engine.*` artifact types are now `ethos.parser.*`, `profile_sha256` moves for every artifact — on `parser_version` alone for PDF, whose backend is `lopdf`, and on both that and `BackendIdentity.name` for the eight office profiles, which really did carry the crate name — and the MCP `serverInfo.name`, the `ETHOS_ENGINE` environment variables and the CLI binary follow. `ethos.grounding.v1` and the `ETHOS_BIN`/`ETHOS_FIXTURES` oracle variables are Ethos's and did not move. Geometric block structure landed as 0.42.0 — a MINOR, because a reader changed: the reading-order cut stops discarding its own grouping and every text run carries the `region` it landed in, `reading_order_rule` moves `gutter-columns-v1` -> `gutter-columns-v2`, and the Markdown and HTML projections stop welding a hyphenated word across a column gutter. Reading order itself is byte-identical, which is the point of the separate id. Ink the document draws off its own page stopped refusing to seal at 0.42.1 — the same shape as v1-S6.2's: that slice changed no reader and every gate artifact is byte-identical at equal version, but six of two hundred DP-Bench documents that produced no artifact at all now produce one. **The version is labelled a PATCH and should have been a MINOR**, and the label describes the slice rather than the version: 0.42.1 shipped twenty-one commits and the CHANGELOG named one, and among the other twenty are `extract --max-pages` (a feature), a ZIP end-of-central-directory repair that widens the archives this engine accepts, and a font-cache repair that changes which documents produce an artifact at all. It is not renumbered — nothing is tagged, `0.43.0` is spent on the slice after it, and `profile_sha256` `686e85cb` is pinned to the string `0.42.1` — so moving it would spend a version to hide a mistake. See CHANGELOG "0.42.1". `GeometryAbsence::MeasuredOffPage` names a box this engine measured correctly and the document places outside its own page box; the seal's invariant is unchanged, because a reachable case that is not a transform bug is a reason to teach the producer a spelling rather than to widen the one check standing between a transform bug and a plausible-looking artifact. Declared headings reached the projections at 0.43.0 — a MINOR, because an emitter changed: `heading_level` read a PDF's tagged `/H1`..`/H6` and nothing else, so an EPUB whose XHTML says `<h1>` in as many words projected as a paragraph. Both projection ids move — `markdown-blocks-v2` -> `-v3` and `html-blocks-v2` -> `-v3` — because the change went through the function both of them call. ODT and DOCX are deliberately NOT in this slice: ODT carries the fact of a heading and not its level, and DOCX carries neither. A text run stopped being its own block at 0.44.0 — a MINOR, because both emitters changed: `nist-sp-800-207` projected as 68 112 Markdown blocks averaging two characters and now projects as 4 698 averaging 35, runs joining only where the document put them in one marked-content sequence AND drew a space or drew no gap. Both projection ids move again together, `-v3` -> `-v4`, because the rule is one both call. No representation changes. A form XObject the page drew stopped being lost in silence at 0.45.0 — a MINOR, because an artifact changed: the `Do` arm that returns `None` for a `/Subtype /Form` discarded the placement and counted nothing, so a page whose whole content is `q /Xf1 Do Q` emitted zero nodes with `pages_failed: 0` and read as blank. It now carries a document-scoped `form-xobjects-not-descended` with a count. The profile-scoped `form-xobject-text-not-descended` is unchanged and was never a substitute: it rides on every artifact this engine writes, including ones for documents holding no XObject at all, so it states the policy and never what it cost. No rule id moves, because no rule governs a limitation — only `parser_version` does, and it is enough. A composite font's widths were read from the wrong key at 0.46.0 — a MINOR, and the largest correctness repair since 0.42.1: `load_widths` asked a /Type0 dictionary for `/Widths`, which PDF 32000-1 §9.7.4.3 never puts there, so EVERY composite font reported an unknown advance. Measured on the 200-document opendataloader-bench corpus: 50 of 50 documents and 72 of 72 composite fonts declared width-absent, every one of which carried `/W` or `/DW` in the file — a 100% false-positive rate. No width means no ink box means the node is omitted from grounding, so text nodes that cannot be quoted fall 14 683 -> 8 770 of 109 500 (13.4% -> 8.0%) and the font-metrics reason for them falls 6 519 -> 131. NID moves 0.8471 -> 0.8490 as a side effect, because measurable advances let block assembly judge ink-contiguity it previously could not. Widths are claimed ONLY under Identity-H and Identity-V, where the code is the CID by definition; under any other CMap the mapping is unknown and the advance stays absent, now with a reason that names the encoding instead of blaming un-vendored standard-14 AFM tables — the wrong explanation on 50 of the 51 documents that printed it. Extraction is otherwise unchanged: no text is gained or lost, and the node count is identical.
#
# **0.9.0 was a detector change, on the ruled side only.** S7b set out to move
# `unruled::COLUMN_GUTTER_MIN` and measured that no value of it changes any number, so the
# alignment rule is untouched at `unruled-align-v1`. A different defect in the ruled rule was found
# and shipped: `table_detection.ruled` moves from `ruled-rects-v1` to `ruled-rects-v2`. The profile
# hash therefore carries both that and `parser_version`. See CHANGELOG and docs/table-gate-v1.md.
#
# **0.36.3 changes no reader and is a PATCH for exactly that reason.** v2-S23 revisits the two
# coverages v2-S20 and v2-S21 retired. `CheckStatus::Mismatch` on the wire: verified still reachable
# through a geometric-only fault — `tables::tests::near_edges_fold_into_one_lattice_line` emits a
# 2 x 2 whose one-centipoint fold is a `CellsOverlap`, and v2-S23 pins that variant so the state
# cannot be retired by a silent refactor. `lopdf`'s catalog-scan recovery: argued for deletion
# rather than a fixture — it is a backend leniency the engine never guaranteed and fixturing it
# would assert the opposite of fail-closed. `ci/code-lines.py` diffs empty across the commit; the
# only changes under `crates/*/src` are inside `mod tests`, which it excludes. The profile hash
# moves because `parser_version` is in it.
#
# **0.36.2 changes no detector and is a PATCH.** v2-S22 is a diagnostic: it answers why ten of the
# twelve gate documents produce no table at all, adds a `cfg(test)` per-page detection report and a
# standing count of what the alignment rule detects, and states micro recall beside the macro in
# `docs/table-gate-v1.md`. No rule id, tolerance or profile field moves — the canonical default
# profile differs from 0.36.1's only in `parser_version`, and `the_default_profile_is_pinned`
# proves it. The finding: `unruled-align-v1` has emitted no table on any of the twelve, so v1's
# remaining gap is the ruled and stroke-ruled rules alone, on producers that draw partial or no
# ruling. The profile hash moves because `parser_version` is in it, and a version claiming
# otherwise would be the drift a hashed profile exists to prevent.
#
# **0.36.1 changes no reader and is a PATCH for exactly that reason.** v2-S21 makes
# `flip-tail-byte` seek the file trailer's cross-reference pointer instead of a fixed fraction of
# the file's length, which it had claimed to reach since M7 and never did on a document larger than
# a few kilobytes. Nothing under `crates/*/src` moves — `ci/code-lines.py` diffs empty across the
# commit — so no artifact this build writes differs from one 0.36.0 wrote. What moves is the
# mutation corpus's pinned totals: survivors 78 to 60, inapplicable pairs 21 to 23, mutants 363 to
# 361, because all eighteen `flip-tail-byte` survivors now fail closed.
#
# **0.36.0 is a detector change, on the ruled side only, and it REMOVES output.** v2-S20 makes the
# ruled rule refuse a grid whose own structural cross-check rejects it, so `table_detection.ruled`
# moves from `ruled-rects-v2` to `ruled-rects-v3` and the profile hash carries both that and
# `parser_version`. A MINOR rather than a patch because an artifact this build writes for
# `nist-sp-800-218` has nine fewer tables and 1 028 fewer cells than one 0.35.0 wrote for the same
# bytes. The alignment and stroke-ruled rules are untouched: their cells tile their table by
# construction, so their cross-check cannot fail and gating them would be dead code. See CHANGELOG
# and docs/table-gate-v1.md.
#
# **0.10.0 adds a THIRD detection rule**, `stroke-ruled-v1` — grids the author drew as ruling
# lines. `table_detection` grows a third field, so the profile hash moves for a reason a reader
# can name, and the profile stops declaring `stroke-ruled-tables-not-detected` because it is no
# longer true. 0.10.0 rather than 0.9.1: a rule that emits tables no earlier build could emit is
# not a patch.
#
# **0.11.0 is the first version of v1.1**, and it adds an OUTPUT: `ethos.markdown.v1`, a Markdown
# projection that is always paired with an Anchor Map inverting it back to representation nodes.
# The profile grows `markdown_rule` and `capabilities.markdown`, so the hash moves. See
# docs/history/10-V11-SCOPE.md and docs/history/11-V11-MILESTONES.md.
#
# **0.12.0 projects BLOCKS**: `markdown_rule` moves from `markdown-linear-v1` to
# `markdown-blocks-v1`, so a table comes out as a GFM grid and a tagged list as list items. Both
# the profile hash and the representation shape move — `TableCellRecord` gains `node_ids`, without
# which a GFM cell could not be emitted as a `source` segment at all — and the profile stops
# declaring `markdown-table-structure-not-projected` because it is no longer true. 0.12.0 rather
# than 0.11.1: a projection that emits a grid no earlier build could emit is not a patch.
#
# **0.13.0 is one export-only cosmetic**: `markdown_rule` moves to `markdown-blocks-v2` and a word
# the page broke across a line comes out closed up — `hyphen-` + `ated` reads `hyphenated`. The
# REPRESENTATION is untouched: `extract` still emits both halves with the hyphen verbatim, so the
# joined word is readable and not citable, and the map names both runs on the joined bytes while
# the hyphen goes in a counted bucket. 0.13.0 rather than 0.12.1 for the reason 0.12.0 was not a
# patch: a document comes out differently, so two artifacts either side must not compare equal.
#
# **0.14.0 adds a SECOND PROJECTION**: `ethos.html.v1`, under the same four laws. The profile
# grows `html_rule` and `capabilities.html`, so the hash moves for a reason a reader can name. It
# is not Markdown with angle brackets — GFM cannot say `rowspan`, so the Markdown projection has to
# expand a merged cell and count what that cost, while HTML emits one `<td colspan="2">` and
# carries the merge. `markdown_rule` does NOT move: that projection is byte-for-byte what 0.13.0
# emitted.
#
# **0.14.1 repairs 0.14.0**, and moves `html_rule` to `html-blocks-v2` with it. `html-blocks-v1`
# existed for one commit and got two tables wrong: a span colliding with another cell's origin
# widened a row past the declared grid, and a list whose tree skipped a depth came out unbalanced.
# Nothing was ever published under it — never tagged, never pushed — so no consumer holds such an
# artifact. The id and the version move anyway, because two builds in this repository's own history
# producing different bytes under one id is precisely the state a rule id exists to make
# impossible. A patch bump, on the precedent of the S6 repair slices (0.8.1, 0.8.2).
#
# **0.15.0 starts v1.2 — ADOPTION — and adds no parse feature at all.** `ethos-parser mcp` serves the
# existing stages over MCP on stdio: newline-delimited JSON-RPC over a pipe, no HTTP, no socket, no
# async runtime, so `deny.toml`'s network bans stay in force and `Cargo.lock` gains nothing. No
# profile FIELD moves: a transport is not a parse capability, and `capabilities.mcp` would put a
# flag on every artifact that no consumer can act on. The profile hash moves on `parser_version`
# ALONE — the same shape v1-S7b (0.9.0) had, where nothing else moved and the hash moved anyway,
# because a version claiming otherwise is the one lie that field cannot afford.
#
# **0.16.0 is v1.2-S2, the Python SDK, and it adds no Rust at all.** `packages/python/` wraps the
# `ethos-parser` binary with `subprocess` and the stdlib `json` module: `extract` and `ground` shell out
# to the subcommands a shell would run, so byte-identity with the CLI is a tautology rather than a
# promise. `node_get` is the one function with no subcommand behind it — MCP already carries the
# tool and a third CLI verb is speculative — so c14n v1 is ported to Python and runs the Rust
# module's own parity vectors. No PyO3, no maturin, no fifth crate, no runtime dependency.
#
# Nothing but the version moves, the THIRD time that has happened after v1-S7b (0.9.0) and
# v1.2-S1 (0.15.0). An SDK is an adopter, not a parse capability, and `capabilities.python` would
# put a flag on every artifact that no consumer can act on (docs/history/12-V12-SCOPE.md §7). The hash
# moves on `parser_version` alone, because a version claiming otherwise is the one lie that field
# cannot afford.
#
# **0.17.0 is v1.2-S3, the Node SDK, and it adds no Rust either.** `packages/node/` is the same
# three functions `packages/python/` shipped, on the same terms: spawn the `ethos-parser` binary, parse
# stdout, hand back the bytes the CLI printed. JavaScript + `node:test`, no TypeScript, no
# bundler, no runtime dependency — and NO NATIVE ADDON, refused for the reason S2 refused PyO3: a
# second path to the library is a second thing that can disagree with the first, and napi would
# add a prebuild matrix across platforms and ABI versions to buy it.
#
# It is not a second design. If Node disagreed with Python about a signature, an error name or
# what `ground` accepts, Node would be the one that is wrong; a test pins both SDKs to this
# version string for the same reason.
#
# Nothing but the version moves, the FOURTH time, after v1-S7b (0.9.0), v1.2-S1 (0.15.0) and
# v1.2-S2 (0.16.0). A language binding is an adopter, not a parse capability, so there is no
# `capabilities.node` for the reason there is no `capabilities.python` and no `capabilities.mcp`
# (docs/history/12-V12-SCOPE.md §7).
#
# **0.18.0 is v1.2-S4, LangChain tools, and it adds no Rust either.** Three callable tools per
# language, each one calling the SDK that already exists — nothing spawns `ethos-parser` a third way and
# nothing here speaks MCP. The slice is one sentence from docs/history/12-V12-SCOPE.md §3: LOCATORS LIVE
# IN THE ARTIFACT, NEVER IN THE PROSE A MODEL READS AND EDITS. MCP says that with
# `structuredContent` vs `content`; LangChain says it with a tool's `artifact` vs its `content`,
# and `response_format="content_and_artifact"` is what makes the two sides real.
#
# LangChain is an OPTIONAL EXTRA (Python) and an OPTIONAL PEER (Node), reached on a subpath, so
# `import ethos_parser` and `import "ethos-parser"` still pull nothing. No LangGraph adapter: the
# memo refused one, because a bindable tool is already what LangGraph binds.
#
# Nothing but the version moves, the FIFTH time, after v1-S7b (0.9.0) and v1.2-S1/S2/S3. A
# framework binding is an adopter, not a parse capability, so there is no `capabilities.langchain`
# for the reason there is no `capabilities.node` (docs/history/12-V12-SCOPE.md §7).
#
# **0.19.0 is v1.2-S5, and the slice's answer is NO.** S5 asked for a `liteparse ->
# ethos.grounding.v1` adapter "IF IT IS WORTH IT". It is not, for two reasons that are properties of
# `ethos.grounding.v1` rather than of any document: their JSON emits `page,width,height,text,
# text_items` AND NOTHING ELSE, so it cannot name its own producer, while this schema requires
# `producer: {name, version}` and has no way to mark a field asserted rather than measured; and
# their boxes are loose em boxes, which 01-CONTRACT.md §5.3 says must be declared as such, and this
# schema has nowhere to declare it. Loose boxes here would be checklist L18 — "sold as precise
# positioning, with nothing in the output saying which it is" — reproduced inside this repository's
# own artifact type. No adapter ships, and the refusal is pinned to those schema facts by
# `ethos-parser-grounding/tests/liteparse_refusal.rs` so relaxing one reopens the decision deliberately.
#
# The memo's predicted blocker — `coordinate_origin: unknown` — DISSOLVED and that is recorded:
# their space is top-left/72-DPI/CropBox->MediaBox and this engine's visible box is the same box,
# so geometry was never the problem. Provenance and box semantics were.
#
# The version moves on the precedent of v1-S7b (0.9.0), where a slice measured a dead end, shipped
# no feature, and bumped anyway: two builds that disagree about what this repository decided must
# not both call themselves 0.18.0.
#
# **0.20.0 is v2-S1, a contract decision with no reader.** "A DOCX quote grounds" is decided:
# `ethos.grounding.v1` STAYS PDF-ONLY. No page-less source shape, no optional `page`, no forked
# schema — revising the artifact is a change to the VERIFIER's contract, and oracle.rs agrees with
# the pinned Ethos CLI on this exact schema, so an engine-only revision would produce artifacts the
# verifier does not speak while both still called themselves ethos.grounding.v1.
#
# **And the measurement resized S2.** S0 assumed the page assumption lived in the grounding schema,
# so that deciding this would leave v2's gate reachable "at the representation level". It does not:
# `DocumentRepresentation::seal` refuses a node whose parent is not a declared page, on BOTH
# construction paths, so a page-less document cannot become a representation either. The invariant
# is in `ethos-parser-core`, and 04-ARCHITECTURE.md §6's precondition — "provided ethos-parser-grounding never
# learned about pages" — HOLDS while pointing at the wrong crate. See
# `ethos-parser-grounding/tests/page_less_source.rs`.
#
# No reader, no crate, no schema field. The version moves because tests landed and because a slice
# that measures still moves it — the S7b and v1.2-S5 precedent.
#
# **0.21.0 is v2-S2: the first office reader, and the IR change S1 measured.** DOCX enters the
# representation — `word/document.xml`'s `<w:p>`/`<w:r>`/`<w:t>`, addressed by part + paragraph +
# run — and NOTHING ON THAT PATH IS A PAGE. `pages` is `[]`, geometry is `NotApplicableToKind`, and
# `check_structure` now splits on the LOCATOR FAMILY: a paginated address still needs its declared
# page (unchanged, message included), a page-less one needs a part id, and a page-less node with a
# measured box is refused outright because there is no page to check it against.
#
# The PDF profile hash moves on `parser_version` ALONE — its canonical bytes are otherwise
# identical, `XrefRepair`'s new `not-run-for-this-format` state notwithstanding, because the PDF
# profile does not carry it. What is new is a SECOND profile: `Profile::docx_v0`, with its own
# hash, so a DOCX artifact and a PDF artifact are provably non-comparable (14-V2-SCOPE.md §8).
#
# The fifth crate stops being speculative: `ethos-parser-office`, exactly as 04-ARCHITECTURE.md said it
# would be revisited "when office needs a real home". One new crate in the lock — `quick-xml` —
# because ZIP is read here over `flate2`, which the graph already had, rather than by taking a zip
# crate that drags twelve transitives including a compressor.
#
# `ethos.grounding.v1` is UNTOUCHED and `ethos-parser ground` on a DOCX is a named refusal, per v2-S1's
# decision (b). `mcp.rs` is untouched too, and `node_get` resolves a DOCX run anyway — which is
# what "one IR, one serializer" buys.
#
# v1 itself is STILL not done — the S7 cell gate is measured and MISSED at 64‰ — so this is not
# 1.0.0 and will not be until docs/history/09-V1-MILESTONES.md S7 is green. v1.1 started because the owner
# asked for the next roadmap row, not because the gate cleared.
#
# **0.22.0 is v2-S3: a workbook's CELL binds, and the coordinate_system question closes.** XLSX
# enters the representation — sheets from `xl/workbook.xml`, cells from each worksheet's
# `<sheetData>`, strings from the shared table — addressed by part + sheet + row + column, and
# NOTHING ON THAT PATH IS A PAGE. A spreadsheet's page is a print artefact: column widths, print
# areas and page breaks are all rendering instructions, and none of them is read.
#
# THE COLUMN STAYS AS LETTERS. `<c r="B12">` writes the column as `B` and the row as `12`; reading
# `12` as a number is reading, but turning `B` into `2` is arithmetic on a bijective base-26
# numeral that the workbook never performed. The two halves concatenate back to the `r` attribute
# exactly, which is the difference between a locator that quotes and one that computes.
#
# NO NEW CRATE and NO NEW DEPENDENCY. The same `ethos-parser-office`, the same hand-rolled ZIP over
# `flate2`, the same `quick-xml` — no `zip`, no `calamine`, no spreadsheet library. What IS new is
# a workbook being the first artifact with MORE THAN ONE PART, which `ethos-parser-core` needed no
# change to allow: the part-id/part-name rule was already a bijection and ordinals already counted
# per parent.
