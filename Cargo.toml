# until a renderer invents one and a workbook's is a printer's, but an ODT literally contains
# `<text:soft-page-break/>`: the position at which the PRODUCING APPLICATION's layout fell, written
# down at save time, next to an `fo:page-width` in `styles.xml`. A `PageRecord` needed no arithmetic
# at all. It is refused for L30's own reason — it invents pagination, and it moves when the font
# stack or the paper does — so the break is read, discarded, and `pages` stays `[]`.
#
# THE ATOM IS THE PARAGRAPH, and `<text:span>` was rejected for two reasons the format supplies: an
# ODF paragraph may contain no span at all, and where spans exist their boundaries are wherever a
# word was bolded, so a quoted sentence would bind to none of the three nodes it became.
