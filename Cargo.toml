# **0.27.0 is v2-S8: an RTF PARAGRAPH binds, and the format has no container at all.** Rich Text
# Format enters the representation — a brace-group control-word byte stream, with `\par`, `\sect`,
# `\cell` and `\row` as the addresses — and the reason this is a slice is what it does NOT have.
#
# NOT A PACKAGE. Every v2 format before this one is a ZIP: the reader opens by asking a container a
# question and mints one part id per part. An `.rtf` has no parts, no manifest, no relationship
# table and no name for itself. So `RtfLocator` carries ONE field and `check_structure`'s page-less
# invariant grew a FOURTH rule — a part-less format's nodes all share one container id — rather than
# this reader inventing a constant part name so the old bijection would pass. A string the document
# does not contain is `docs/history/14-V2-SCOPE.md` §3's "absent, not invented" in a smaller place than the
# page-sized box that obligation is usually about.
#
# THE PAGE, SAID OUT LOUD. An ODT hides its page in `<text:soft-page-break/>` and an ODP in a
# `<draw:page>` element. RTF writes `\page`, and `\paperw` beside it. Both are the producing
# application's print arithmetic, `pages` stays `[]`, and `docs/06-STEAL-REFUSE.md` L30 refuses
# invented pagination whether inventing it costs a renderer or costs nothing.
#
# SKIP UNLESS TRANSPARENT, which is `odt.rs`'s inverted allowlist in a non-XML format. A group is
# read only when its first control word is formatting; everything else — `\fonttbl`, `\stylesheet`,
# `\info`, `\pict`, `\header`, `\footer`, `\footnote`, `\field`, and every `{\*\…}` — is
# skipped and COUNTED. The failure mode is a phrase reported missing, never a header's words spliced
# into the body, which is A14 inverted and the worse of the two.
#
# `\'hh` ABOVE 0x7F IS DECLARED, NEVER GUESSED. Its meaning depends on a code page this reader does
# not carry a table for, so it contributes no character and is counted. Below 0x80 the byte is the
# same character in every ANSI code page, so reading it is reading. `\uN` is the scalar it names,
# surrogate pairs included, and `\ucN` says how many fallback characters to skip.
#
# ONE DEFECT WORTH NAMING: the first version marked the NEW group decided when a `{` opened, so
# every destination test passed transparently and the whole skip rule was silently off. Found by the
