#
# S8 is RTF and is done; S9 parks EPUB and CSV. v2's gate is still a DOCX quote and an XLSX cell;
# this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and the 0.489 chase
# is STILL parked.
