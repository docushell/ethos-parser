# ethos-engine workspace.
#
# Five crates as of v2-S2 (docs/04-ARCHITECTURE.md §1). The fifth was refused until a second
# format existed — "a fifth crate before a second format is speculative structure" — and DOCX is
# that format, so `engine-office` stops being speculative and starts being the only place OOXML
# may live.
#
# Boundary rules, enforced in review:
#   engine-core       — no PDF concept, and no OOXML concept
#   engine-pdf        — no grounding concept
#   engine-office     — no PDF concept, no grounding concept (OOXML and ODF both live here)
#   engine-grounding  — no format concept — it projects the representation, never a document
#   engine-cli        — no logic

[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-pdf",
    "crates/engine-office",
    "crates/engine-grounding",
    "crates/engine-cli",
]
# `fuzz/` is a cargo-fuzz package, not a member (M7). Excluding it keeps `libfuzzer-sys` — a
# nightly-only sanitizer shim — out of the workspace dependency graph, which is what `cargo deny
# check` inspects and what `cargo build --workspace` compiles. The fuzz crate depends on the
# engine; nothing in the engine depends on it. See `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[workspace.package]
# v0.1 (0.2.0). `parser_version` is read from this (`Profile::default`), so the bump is an
# identity event: `profile_sha256` moves, and every artifact produced before and after is
# correctly non-comparable. That is the design, not a regression — see CHANGELOG.
#
# The version number leads the roadmap label by one minor: v0 shipped as 0.1.0 (M7), the "v0.1"
# roadmap row shipped as 0.2.0, and v1's slices ship one minor each — S1 as 0.3.0, S2 as 0.4.0,
# S3 as 0.5.0, S4 as 0.6.0, S5 as 0.7.0, S6 as 0.8.0, the S6 repair slices as 0.8.1 and 0.8.2,
# S7a/S7b as 0.9.0, S8 as 0.10.0, v1.1-S0/S1 as 0.11.0, v1.1-S2 as 0.12.0, v1.1-S3 as 0.13.0, v1.1-S4 as 0.14.0, its repair as 0.14.1, v1.2-S0/S1 as 0.15.0, v1.2-S2 as 0.16.0, v1.2-S3 as 0.17.0, v1.2-S4 as 0.18.0, v1.2-S5 as 0.19.0, v2-S1 as 0.20.0, v2-S2 as 0.21.0, v2-S3 as 0.22.0, v2-S4 as 0.23.0, v2-S5 as 0.24.0, v2-S6 as 0.25.0, v2-S7 as 0.26.0, v2-S8 as 0.27.0, v2-S9 as 0.28.0, its counter repair as 0.28.1, v2-S10 as 0.29.0, its documentation repair as 0.29.1, v2-S11 as 0.30.0, v2-S12 as 0.31.0, its guard repair as 0.31.1, v2-S13 as 0.32.0, its guard repair as 0.32.1, the roadmap reorder as 0.32.2, its prose repair as 0.32.3, the owner's two gate decisions as 0.32.4, the two sweeps that never ran as 0.32.5, and the CRC-32 answer as 0.33.0 — a MINOR, because it changes a reader.
#
# **0.9.0 was a detector change, on the ruled side only.** S7b set out to move
# `unruled::COLUMN_GUTTER_MIN` and measured that no value of it changes any number, so the
# alignment rule is untouched at `unruled-align-v1`. A different defect in the ruled rule was found
# and shipped: `table_detection.ruled` moves from `ruled-rects-v1` to `ruled-rects-v2`. The profile
# hash therefore carries both that and `parser_version`. See CHANGELOG and docs/table-gate-v1.md.
#
# **0.10.0 adds a THIRD detection rule**, `stroke-ruled-v1` — grids the author drew as ruling
# lines. `table_detection` grows a third field, so the profile hash moves for a reason a reader
# can name, and the profile stops declaring `stroke-ruled-tables-not-detected` because it is no
# longer true. 0.10.0 rather than 0.9.1: a rule that emits tables no earlier build could emit is
# not a patch.
#
# **0.11.0 is the first version of v1.1**, and it adds an OUTPUT: `ethos.markdown.v1`, a Markdown
# projection that is always paired with an Anchor Map inverting it back to representation nodes.
# The profile grows `markdown_rule` and `capabilities.markdown`, so the hash moves. See
# docs/10-V11-SCOPE.md and docs/11-V11-MILESTONES.md.
#
# **0.12.0 projects BLOCKS**: `markdown_rule` moves from `markdown-linear-v1` to
# `markdown-blocks-v1`, so a table comes out as a GFM grid and a tagged list as list items. Both
# the profile hash and the representation shape move — `TableCellRecord` gains `node_ids`, without
# which a GFM cell could not be emitted as a `source` segment at all — and the profile stops
# declaring `markdown-table-structure-not-projected` because it is no longer true. 0.12.0 rather
# than 0.11.1: a projection that emits a grid no earlier build could emit is not a patch.
#
# **0.13.0 is one export-only cosmetic**: `markdown_rule` moves to `markdown-blocks-v2` and a word
# the page broke across a line comes out closed up — `hyphen-` + `ated` reads `hyphenated`. The
# REPRESENTATION is untouched: `extract` still emits both halves with the hyphen verbatim, so the
# joined word is readable and not citable, and the map names both runs on the joined bytes while
# the hyphen goes in a counted bucket. 0.13.0 rather than 0.12.1 for the reason 0.12.0 was not a
# patch: a document comes out differently, so two artifacts either side must not compare equal.
#
# **0.14.0 adds a SECOND PROJECTION**: `ethos.html.v1`, under the same four laws. The profile
# grows `html_rule` and `capabilities.html`, so the hash moves for a reason a reader can name. It
# is not Markdown with angle brackets — GFM cannot say `rowspan`, so the Markdown projection has to
# expand a merged cell and count what that cost, while HTML emits one `<td colspan="2">` and
# carries the merge. `markdown_rule` does NOT move: that projection is byte-for-byte what 0.13.0
# emitted.
#
# **0.14.1 repairs 0.14.0**, and moves `html_rule` to `html-blocks-v2` with it. `html-blocks-v1`
# existed for one commit and got two tables wrong: a span colliding with another cell's origin
# widened a row past the declared grid, and a list whose tree skipped a depth came out unbalanced.
# Nothing was ever published under it — never tagged, never pushed — so no consumer holds such an
# artifact. The id and the version move anyway, because two builds in this repository's own history
# producing different bytes under one id is precisely the state a rule id exists to make
# impossible. A patch bump, on the precedent of the S6 repair slices (0.8.1, 0.8.2).
#
# **0.15.0 starts v1.2 — ADOPTION — and adds no parse feature at all.** `engine mcp` serves the
# existing stages over MCP on stdio: newline-delimited JSON-RPC over a pipe, no HTTP, no socket, no
# async runtime, so `deny.toml`'s network bans stay in force and `Cargo.lock` gains nothing. No
# profile FIELD moves: a transport is not a parse capability, and `capabilities.mcp` would put a
# flag on every artifact that no consumer can act on. The profile hash moves on `parser_version`
# ALONE — the same shape v1-S7b (0.9.0) had, where nothing else moved and the hash moved anyway,
# because a version claiming otherwise is the one lie that field cannot afford.
#
# **0.16.0 is v1.2-S2, the Python SDK, and it adds no Rust at all.** `packages/python/` wraps the
# `engine` binary with `subprocess` and the stdlib `json` module: `extract` and `ground` shell out
# to the subcommands a shell would run, so byte-identity with the CLI is a tautology rather than a
# promise. `node_get` is the one function with no subcommand behind it — MCP already carries the
# tool and a third CLI verb is speculative — so c14n v1 is ported to Python and runs the Rust
# module's own parity vectors. No PyO3, no maturin, no fifth crate, no runtime dependency.
#
# Nothing but the version moves, the THIRD time that has happened after v1-S7b (0.9.0) and
# v1.2-S1 (0.15.0). An SDK is an adopter, not a parse capability, and `capabilities.python` would
# put a flag on every artifact that no consumer can act on (docs/12-V12-SCOPE.md §7). The hash
# moves on `parser_version` alone, because a version claiming otherwise is the one lie that field
# cannot afford.
#
# **0.17.0 is v1.2-S3, the Node SDK, and it adds no Rust either.** `packages/node/` is the same
# three functions `packages/python/` shipped, on the same terms: spawn the `engine` binary, parse
# stdout, hand back the bytes the CLI printed. JavaScript + `node:test`, no TypeScript, no
# bundler, no runtime dependency — and NO NATIVE ADDON, refused for the reason S2 refused PyO3: a
# second path to the library is a second thing that can disagree with the first, and napi would
# add a prebuild matrix across platforms and ABI versions to buy it.
#
# It is not a second design. If Node disagreed with Python about a signature, an error name or
# what `ground` accepts, Node would be the one that is wrong; a test pins both SDKs to this
# version string for the same reason.
#
# Nothing but the version moves, the FOURTH time, after v1-S7b (0.9.0), v1.2-S1 (0.15.0) and
# v1.2-S2 (0.16.0). A language binding is an adopter, not a parse capability, so there is no
# `capabilities.node` for the reason there is no `capabilities.python` and no `capabilities.mcp`
# (docs/12-V12-SCOPE.md §7).
#
# **0.18.0 is v1.2-S4, LangChain tools, and it adds no Rust either.** Three callable tools per
# language, each one calling the SDK that already exists — nothing spawns `engine` a third way and
# nothing here speaks MCP. The slice is one sentence from docs/12-V12-SCOPE.md §3: LOCATORS LIVE
# IN THE ARTIFACT, NEVER IN THE PROSE A MODEL READS AND EDITS. MCP says that with
# `structuredContent` vs `content`; LangChain says it with a tool's `artifact` vs its `content`,
# and `response_format="content_and_artifact"` is what makes the two sides real.
#
# LangChain is an OPTIONAL EXTRA (Python) and an OPTIONAL PEER (Node), reached on a subpath, so
# `import ethos_engine` and `import "ethos-engine"` still pull nothing. No LangGraph adapter: the
# memo refused one, because a bindable tool is already what LangGraph binds.
#
# Nothing but the version moves, the FIFTH time, after v1-S7b (0.9.0) and v1.2-S1/S2/S3. A
# framework binding is an adopter, not a parse capability, so there is no `capabilities.langchain`
# for the reason there is no `capabilities.node` (docs/12-V12-SCOPE.md §7).
#
# **0.19.0 is v1.2-S5, and the slice's answer is NO.** S5 asked for a `liteparse ->
# ethos.grounding.v1` adapter "IF IT IS WORTH IT". It is not, for two reasons that are properties of
# `ethos.grounding.v1` rather than of any document: their JSON emits `page,width,height,text,
# text_items` AND NOTHING ELSE, so it cannot name its own producer, while this schema requires
# `producer: {name, version}` and has no way to mark a field asserted rather than measured; and
# their boxes are loose em boxes, which 01-CONTRACT.md §5.3 says must be declared as such, and this
# schema has nowhere to declare it. Loose boxes here would be checklist L18 — "sold as precise
# positioning, with nothing in the output saying which it is" — reproduced inside this repository's
# own artifact type. No adapter ships, and the refusal is pinned to those schema facts by
# `engine-grounding/tests/liteparse_refusal.rs` so relaxing one reopens the decision deliberately.
#
# The memo's predicted blocker — `coordinate_origin: unknown` — DISSOLVED and that is recorded:
# their space is top-left/72-DPI/CropBox->MediaBox and this engine's visible box is the same box,
# so geometry was never the problem. Provenance and box semantics were.
#
# The version moves on the precedent of v1-S7b (0.9.0), where a slice measured a dead end, shipped
# no feature, and bumped anyway: two builds that disagree about what this repository decided must
# not both call themselves 0.18.0.
#
# **0.20.0 is v2-S1, a contract decision with no reader.** "A DOCX quote grounds" is decided:
# `ethos.grounding.v1` STAYS PDF-ONLY. No page-less source shape, no optional `page`, no forked
# schema — revising the artifact is a change to the VERIFIER's contract, and oracle.rs agrees with
# the pinned Ethos CLI on this exact schema, so an engine-only revision would produce artifacts the
# verifier does not speak while both still called themselves ethos.grounding.v1.
#
# **And the measurement resized S2.** S0 assumed the page assumption lived in the grounding schema,
# so that deciding this would leave v2's gate reachable "at the representation level". It does not:
# `DocumentRepresentation::seal` refuses a node whose parent is not a declared page, on BOTH
# construction paths, so a page-less document cannot become a representation either. The invariant
# is in `engine-core`, and 04-ARCHITECTURE.md §6's precondition — "provided engine-grounding never
# learned about pages" — HOLDS while pointing at the wrong crate. See
# `engine-grounding/tests/page_less_source.rs`.
#
# No reader, no crate, no schema field. The version moves because tests landed and because a slice
# that measures still moves it — the S7b and v1.2-S5 precedent.
#
# **0.21.0 is v2-S2: the first office reader, and the IR change S1 measured.** DOCX enters the
# representation — `word/document.xml`'s `<w:p>`/`<w:r>`/`<w:t>`, addressed by part + paragraph +
# run — and NOTHING ON THAT PATH IS A PAGE. `pages` is `[]`, geometry is `NotApplicableToKind`, and
# `check_structure` now splits on the LOCATOR FAMILY: a paginated address still needs its declared
# page (unchanged, message included), a page-less one needs a part id, and a page-less node with a
# measured box is refused outright because there is no page to check it against.
#
# The PDF profile hash moves on `parser_version` ALONE — its canonical bytes are otherwise
# identical, `XrefRepair`'s new `not-run-for-this-format` state notwithstanding, because the PDF
# profile does not carry it. What is new is a SECOND profile: `Profile::docx_v0`, with its own
# hash, so a DOCX artifact and a PDF artifact are provably non-comparable (14-V2-SCOPE.md §8).
#
# The fifth crate stops being speculative: `engine-office`, exactly as 04-ARCHITECTURE.md said it
# would be revisited "when office needs a real home". One new crate in the lock — `quick-xml` —
# because ZIP is read here over `flate2`, which the graph already had, rather than by taking a zip
# crate that drags twelve transitives including a compressor.
#
# `ethos.grounding.v1` is UNTOUCHED and `engine ground` on a DOCX is a named refusal, per v2-S1's
# decision (b). `mcp.rs` is untouched too, and `node_get` resolves a DOCX run anyway — which is
# what "one IR, one serializer" buys.
#
# v1 itself is STILL not done — the S7 cell gate is measured and MISSED at 64‰ — so this is not
# 1.0.0 and will not be until docs/09-V1-MILESTONES.md S7 is green. v1.1 started because the owner
# asked for the next roadmap row, not because the gate cleared.
#
# **0.22.0 is v2-S3: a workbook's CELL binds, and the coordinate_system question closes.** XLSX
# enters the representation — sheets from `xl/workbook.xml`, cells from each worksheet's
# `<sheetData>`, strings from the shared table — addressed by part + sheet + row + column, and
# NOTHING ON THAT PATH IS A PAGE. A spreadsheet's page is a print artefact: column widths, print
# areas and page breaks are all rendering instructions, and none of them is read.
#
# THE COLUMN STAYS AS LETTERS. `<c r="B12">` writes the column as `B` and the row as `12`; reading
# `12` as a number is reading, but turning `B` into `2` is arithmetic on a bijective base-26
# numeral that the workbook never performed. The two halves concatenate back to the `r` attribute
# exactly, which is the difference between a locator that quotes and one that computes.
#
# NO NEW CRATE and NO NEW DEPENDENCY. The same `engine-office`, the same hand-rolled ZIP over
# `flate2`, the same `quick-xml` — no `zip`, no `calamine`, no spreadsheet library. What IS new is
# a workbook being the first artifact with MORE THAN ONE PART, which `engine-core` needed no
# change to allow: the part-id/part-name rule was already a bijection and ordinals already counted
# per parent.
#
# THE COORDINATE_SYSTEM DECISION LANDS HERE, as v2-S2 said it would. Nothing acts on the value for
# a page-less artifact, so both office profiles keep the inert `centipoint`/`top-left` declaration
# and NO mode enum was added — one would have moved every PDF artifact's hash to respell a value
# nothing reads. This version moves the PDF hash on `parser_version` ALONE, exactly as S2 did.
# **0.23.0 is v2-S4: a SLIDE binds, and a slide is a PART.** PPTX enters the representation —
# `ppt/presentation.xml`'s slide list, each slide's shapes, `<a:t>` runs — addressed by part +
# shape + paragraph + run.
#
# THIS IS THE FORMAT THAT TESTED THE LAW RATHER THAN EXTENDING IT. A DOCX has no page until a
# renderer invents one and a spreadsheet's page is a printer's, but a SLIDE IS REAL: discrete,
# listed in the package, and counted out loud. Both routes to calling it a page are refused —
# `p:sldSz` is a size nothing measured against, and a position in `<p:sldIdLst>` is display order
# that changes when a deck is reordered. `pages` is `[]` and the locator carries NO SLIDE NUMBER.
#
# TWO MEASUREMENTS CHANGED THE DESIGN BEFORE IT SHIPPED. Shape ids are not unique in real decks
# (12 of 329 measured slides reuse one, and PowerPoint opens them), so the address is a position
# and the id is a label. And `<mc:Fallback>` duplicates its sibling `<mc:Choice>`, so reading both
# would emit one phrase twice at two addresses — the mirror of a silent drop.
#
# NO NEW DEPENDENCY. The same `engine-office`, the same hand-rolled ZIP over `flate2`, the same
# `quick-xml`. What moved is internal: the `r:id`-to-part rule to `opc.rs` and the XML plumbing to
# `xml.rs`, because a third copy of a rule is how two copies of it start disagreeing.
#
# The remaining-formats row SPLIT here, which is what S2 and S3 were measured for: S4 is PPTX and
# is done, S5 parks ODF, RTF, EPUB and CSV. v2's gate names a DOCX quote and an XLSX cell and both
# bind; this is coverage beyond it. v1 is STILL missed at 64‰.
#
# **0.24.0 is v2-S5: an ODT PARAGRAPH binds, and the page break is IN THE FILE.** OpenDocument text
# enters the representation — `content.xml`'s `<text:p>` and `<text:h>` blocks, addressed by part +
# paragraph — and this is the first v2 format that could have had a page for free. DOCX has none
# until a renderer invents one and a workbook's is a printer's, but an ODT literally contains
# `<text:soft-page-break/>`: the position at which the PRODUCING APPLICATION's layout fell, written
# down at save time, next to an `fo:page-width` in `styles.xml`. A `PageRecord` needed no arithmetic
# at all. It is refused for L30's own reason — it invents pagination, and it moves when the font
# stack or the paper does — so the break is read, discarded, and `pages` stays `[]`.
#
# THE ATOM IS THE PARAGRAPH, and `<text:span>` was rejected for two reasons the format supplies: an
# ODF paragraph may contain no span at all, and where spans exist their boundaries are wherever a
# word was bolded, so a quoted sentence would bind to none of the three nodes it became.
#
# TWO NUMBERS ON ONE NODE, deliberately different: `Node.ordinal` counts nodes in the artifact and
# `OdtLocator.paragraph` counts blocks IN THE FILE, including the ones inside a footnote or a
# comment this slice does not read. A reader that numbered only what it kept would put every
# citation after a footnote on the wrong paragraph.
#
# NO NEW DEPENDENCY. The same `engine-office`, the same hand-rolled ZIP over `flate2`, the same
# `quick-xml` — no `zip`, no ODF crate, no LibreOffice. `Profile::odt_v0` has its own hash, five
# profiles are now mutually distinct, and this hash moves on `parser_version` ALONE as at S2, S3
# and S4.
#
# WHAT COULD NOT BE MEASURED IS RECORDED: no corpus of real `.odt` files was available and no ODF
# producer was either, so unlike S3 and S4 nothing here changed after meeting real files. Every rule
# is read off the OpenDocument specification and pinned against fixtures this repository authored,
# and the judgement calls are made toward OVER-DECLARING.
#
# The parked row splits again: S5 is ODT and is done, S6 parks ODS, ODP, RTF, EPUB and CSV. v2's
# gate is still a DOCX quote and an XLSX cell; this is coverage beyond it. v1 is STILL missed at
# 64‰.
#
# **0.25.0 is v2-S6: an ODS CELL binds, at a position the file never writes down.** OpenDocument
# spreadsheets enter the representation — `content.xml`'s `<table:table-cell>`, addressed by the
# table's own name plus a row and a column — and the address is what makes this a slice rather than
# a flag on the ODT reader. SpreadsheetML writes `<c r="B12">` and `XlsxLocator` READS it. ODF
# writes NO address at all: a cell's position is where it sits among its siblings, and a run of
# identical cells is compressed into `table:number-columns-repeated="n"`. So the repeats ARE the
# statement of position, honouring them is reading, and the column is a NUMBER because the file
# contains no letters — `B` is a spreadsheet application's convention, not a string this document
# holds.
#
# ONE ALLOWLIST, NOT TWO. The `<text:p>` engine is `odt.rs`'s, imported rather than restated: the
# same twelve inline names, the same namespace resolution, the same whitespace rule. Two copies of a
# rule whose entire content is WHICH NAMES ARE THE SENTENCE is the shape that drifts, and the drift
# is silent — one reader gaining `<text:page-count>` and the other not puts a word processor's page
# arithmetic in one artifact and not the other, with nothing failing.
#
# THE FRAME-ALTERNATIVE RULE IS NOW MEASURED. v2-S5 wrote first-rendition-wins off the specification
# and recorded that it had never met a document nesting two renditions, because it had none. This
# slice authors one: ODF puts `<draw:frame>` in the `<text:p>` content model for every document
# type, so a spreadsheet cell can hold two `<draw:text-box>` children. One is read, the other is
# declared, and the node is NOT the concatenation.
#
# THE `%PDF-` DEFECT S5 DEFERRED IS CLOSED. An `.ods` used to fall past the office branch and be
# refused for having no PDF header — fail-closed, wrong cause. The CLI now asks the ODF FAMILY
# question (`is_opendocument`), and `read` refuses a declared type it does not implement by name. An
# `.odp` says so about itself.
#
# NO NEW DEPENDENCY. The same `engine-office`, the same hand-rolled ZIP over `flate2`, the same
# `quick-xml` — no `zip`, no `calamine`, no ODF crate, no LibreOffice. `Profile::ods_v0` has its own
# hash, six profiles are now mutually distinct, and this hash moves on `parser_version` ALONE.
#
# WHAT COULD NOT BE MEASURED IS RECORDED, again: no corpus of real `.ods` files was available and no
# ODF producer was either. Every rule is read off the specification and pinned against packages this
# repository authors byte by byte.
#
# S6 is ODS and is done; S7 still parks ODP, RTF, EPUB and CSV. v2's gate is still a DOCX quote and
# an XLSX cell; this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and
# the 0.489 chase is STILL parked.
#
# **0.26.0 is v2-S7: an ODP BLOCK binds, and the page that was free stays out.** OpenDocument
# presentations enter the representation — `content.xml`'s `<draw:page>` shapes and their
# `<text:p>` blocks — and the reason this is a slice is the refusal rather than the reader.
#
# THE PAGE WAS FREE HERE. Every page-less format before this one had to ARGUE that its page was
# somebody else's: a DOCX has none until a renderer picks one, a workbook's is a printer's, a PPTX
# slide is a PART, an ODT's soft page break is a word processor's arithmetic. A presentation needs
# no argument at all — `<draw:page>` elements are discrete, listed, ordered and named, a
# `<style:master-page>` states `fo:page-width` beside them, and a `PageRecord` would need NO
# ARITHMETIC. It is refused anyway, on `docs/06-STEAL-REFUSE.md` L30's own four words: "It invents
# pagination." A draw page is a part of the presentation's structure, not a page this engine
# measured. `pages` stays `[]`, and `OdpLocator { part, draw_page, shape, paragraph }` carries a
# POSITION named for the element rather than for what it resembles — `deny_unknown_fields` refuses
# `page`, `bbox`, `x`, `slide_number` and `soft_page_break` by name.
#
# THE NAMES ARE LABELS, on v2-S4's measured precedent. `draw:name` on a page and on a shape is
# optional in ODF and could not be measured unique, because no corpus of real `.odp` files was
# available — so it goes on the attributes, where `<p:cNvPr id>` went when S4 measured it across 18
# real decks and found it unique only most of the time.
#
# THE FRAME RULE, MEASURED A THIRD TIME, AND THE ATOM IS AGAIN WHAT DECIDES. v2-S5 read
# first-rendition-wins off the specification; v2-S6 measured it on a spreadsheet and found that a
# frame floats over the SHEET, so both renditions are erasures. A presentation is a drawing and
# there is nothing to float over: the frame IS the shape this reader addresses, so the first
# rendition becomes nodes — ODT's outcome, reached by neither ODT's nor ODS's argument.
#
# ONE ALLOWLIST, STILL NOT TWO. `odt.rs`'s `Element`, `classify`, namespaces and block engine are
# imported for the third reader. What this format added was a silent drop none of the others had:
# `<draw:frame><draw:image><svg:title>` contains no `<text:p>` at all, so a per-block foreign
# counter never sees it. Counted at the SHAPE now.
#
# NO NEW DEPENDENCY. `Profile::odp_v0` has its own hash, seven profiles are now mutually distinct,
# and this hash moves on `parser_version` ALONE.
#
# S7 is ODP and is done; S8 parks RTF, EPUB and CSV. v2's gate is still a DOCX quote and an XLSX
# cell; this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and the 0.489
# chase is STILL parked.
#
# **0.27.0 is v2-S8: an RTF PARAGRAPH binds, and the format has no container at all.** Rich Text
# Format enters the representation — a brace-group control-word byte stream, with `\par`, `\sect`,
# `\cell` and `\row` as the addresses — and the reason this is a slice is what it does NOT have.
#
# NOT A PACKAGE. Every v2 format before this one is a ZIP: the reader opens by asking a container a
# question and mints one part id per part. An `.rtf` has no parts, no manifest, no relationship
# table and no name for itself. So `RtfLocator` carries ONE field and `check_structure`'s page-less
# invariant grew a FOURTH rule — a part-less format's nodes all share one container id — rather than
# this reader inventing a constant part name so the old bijection would pass. A string the document
# does not contain is `docs/14-V2-SCOPE.md` §3's "absent, not invented" in a smaller place than the
# page-sized box that obligation is usually about.
#
# THE PAGE, SAID OUT LOUD. An ODT hides its page in `<text:soft-page-break/>` and an ODP in a
# `<draw:page>` element. RTF writes `\page`, and `\paperw` beside it. Both are the producing
# application's print arithmetic, `pages` stays `[]`, and `docs/06-STEAL-REFUSE.md` L30 refuses
# invented pagination whether inventing it costs a renderer or costs nothing.
#
# SKIP UNLESS TRANSPARENT, which is `odt.rs`'s inverted allowlist in a non-XML format. A group is
# read only when its first control word is formatting; everything else — `\fonttbl`, `\stylesheet`,
# `\info`, `\pict`, `\header`, `\footer`, `\footnote`, `\field`, and every `{\*\…}` — is
# skipped and COUNTED. The failure mode is a phrase reported missing, never a header's words spliced
# into the body, which is A14 inverted and the worse of the two.
#
# `\'hh` ABOVE 0x7F IS DECLARED, NEVER GUESSED. Its meaning depends on a code page this reader does
# not carry a table for, so it contributes no character and is counted. Below 0x80 the byte is the
# same character in every ANSI code page, so reading it is reading. `\uN` is the scalar it names,
# surrogate pairs included, and `\ucN` says how many fallback characters to skip.
#
# ONE DEFECT WORTH NAMING: the first version marked the NEW group decided when a `{` opened, so
# every destination test passed transparently and the whole skip rule was silently off. Found by the
# unit tests it exists for.
#
# NO NEW DEPENDENCY. A hand-rolled control-word walker in `engine-office`, in character with
# `zip.rs`: no RTF crate, no LibreOffice, no shelling out. `Profile::rtf_v0` has its own hash; eight
# profiles are mutually distinct; `capabilities.tables` is FALSE even though RTF writes `\cell`,
# because that is recorded as a paragraph's TERMINATOR rather than as a grid a detector inferred.
#
# S8 is RTF and is done; S9 parks EPUB and CSV. v2's gate is still a DOCX quote and an XLSX cell;
# this is coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and the 0.489 chase
# is STILL parked.
#
# **0.28.0 is v2-S9: an EPUB BLOCK binds, and the page a publisher named stays out.** EPUB
# publications enter the representation — OCF's `mimetype`, `META-INF/container.xml`, a package
# document's manifest and spine, and the spine's XHTML blocks.
#
# THE FIRST FORMAT WHOSE FILE MAY GENUINELY NAME PAGES. `docs/14-V2-SCOPE.md` §3's law has always
# been "no page THIS ENGINE DID NOT READ FROM THE FILE" rather than "no page ever", and every
# format before this one failed the reading half by construction: a DOCX has no page until a
# renderer picks one, a slide is a PART, an ODT's break is a word processor's arithmetic, a draw
# page is structure, `\page` is a producer's mark. An EPUB 3 navigation document may carry a
# `page-list` mapping locations to the page numbers of a PRINT edition, and an EPUB 2 NCX may carry
# page targets — page identifiers, written down, readable. They are refused anyway, and the reason
# had to be ARGUED rather than looked up: a publisher's label about somebody else's paper has no
# width and no height, so nothing could ever be validated against it, and `check_structure` refuses
# a measured box on a page-less node precisely because a rectangle nobody can check is a
# fabrication. `pages` stays `[]` and the navigation document is a counted region.
#
# READING ORDER IS THE SPINE, AND THE ARCHIVE IS THE TRAP. An EPUB is a ZIP of documents, and
# taking the XHTML entries in central-directory order — or sorted by name — is v2-S3's `sheet{n}`
# defect in a new container. `EpubLocator { part, block }` takes its part from `<itemref idref>`
# resolved through the manifest, with the `href` resolved relative to the package document's own
# directory, and the fixture stores its chapters in the OPPOSITE order to prove it.
#
# HTML'S OWN DEFAULT DISPLAY, WHICH IS STRONGER THAN A LIST. `odt.rs` names its inline elements
# because ODF has no default rendering to appeal to; XHTML does. A block is what HTML gives
# `display: block`, and an XHTML element this reader has never heard of is INLINE — which is
# HTML's own answer for a custom element. Anything outside the XHTML namespace is foreign and
# counted, which is how an inline SVG's `<title>` and a MathML `<annotation>` stay out without a
# list naming them.
#
# THE WHITESPACE ENGINE IS SHARED AND THE THREE PLACES IT IS NOT ARE WRITTEN DOWN: `<pre>` is
# handled, a form feed is passed through rather than collapsed, and a line break between two CJK
# characters becomes a space where CSS would remove it. The third is the widest gap this slice
# knowingly leaves, and it is recorded rather than approximated — the correct rule needs a computed
# `white-space` value and the scripts on both sides, and this reader reads no style sheet.
#
# NUMERIC CHARACTER REFERENCES RESOLVE, in a SECOND function rather than a widening of the shared
# entity rule. `&#160;` is universal in hand-authored XHTML and needs no DTD; widening
# `resolve_entity` would change what six shipped readers do with a document they currently refuse,
# which is six profile hash moves for a slice that measured one format.
#
# NO NEW DEPENDENCY. The same hand-rolled ZIP over `flate2` and the same `quick-xml` — no `zip`
# crate, no EPUB crate, no HTML5 parser: EPUB content documents are XML, and tag soup fails closed.
# `Profile::epub_v0` has its own hash; nine profiles are mutually distinct; `capabilities.tables` is
# FALSE because a `<td>`'s text is read as the block it is.
#
# S9 is EPUB and is done; S10 parks CSV. v2's gate is still a DOCX quote and an XLSX cell; this is
# coverage beyond it, and v2 is NOT complete. v1 is STILL missed at 64‰ and the 0.489 chase is
# STILL parked.
#
# **0.28.1 is v2-S9.1: the erasure counters that could wrap.** A wrapped A14 count is a silent drop
# presented as a success, and v2-S9's review reproduced one at 85x in EPUB. Twenty `+=` sites and
# eight `as u32` casts across seven other readers now saturate. NO reader behaviour changed and no
# counter's meaning changed; the nine profile hashes moved on `parser_version` ALONE, because a
# build that counts differently IS a different profile.
#
# **0.29.0 is v2-S10: CSV as a NAMED REFUSAL, argued and pinned. NO READER.** Bytes that state no
# format at all — no signature, no container, no declaration — are refused by naming what was
# LOOKED FOR, instead of being handed to the PDF reader and told they lack a `%PDF-` header. That
# was fail-closed and named the WRONG CAUSE: the defect v2-S6 fixed for an `.ods`, v2-S8 for an
# `.rtf` and for the ZIP shape, and this slice for the LAST member of that shape.
#
# THE REASON IS ONE FIELD, NOT THE PARSE. A CSV parse of arbitrary text fabricates NOTHING. What
# would be false is `SourceIdentity.media_type` saying `text/csv` about a file nobody measured to
# be one — an invented identifier — and `SourceIdentity` is `deny_unknown_fields` with two fields
# and no room to say "asserted". `docs/13-V12-MILESTONES.md` settled that at v1.2-S5: an identity
# that can be asserted is an identity that can disagree with what it describes.
#
# THE ARGUMENT IS MECHANIZED, not asserted: a `.csv` and a letter containing a shopping list get
# BYTE-IDENTICAL stderr, which only an implementation that sniffed nothing can pass.
#
# NO NEW DEPENDENCY, no tenth profile, no `csv.rs`, no format hint on any surface, and no signature
# at any offset but zero. `MAX_HEADER_OFFSET` stays 0.
#
# S10 is done and **v2's FORMAT ROW IS CLOSED**: eight formats read, one argued refusal, and every
# split from S4 to S9 was made against a measurement. **v2 is NOT complete** — the gate sentence's
# verb and the undelivered embedded-assets obligation are both escalated to the owner and written
# down in `docs/15-V2-MILESTONES.md` S10. v1 is STILL missed at 64‰ and the 0.489 chase is STILL
# parked.
#
# **0.29.1 is v2-S10.2: the docs that stopped describing the code. NO BEHAVIOUR CHANGE.** Sixteen
# sites — eleven doc statements, one crate comment, both projection draft-schema examples, this
# file's own history line and `fuzz/Cargo.lock` — were false at
# 0.29.0. `docs/README.md` told a reader v2 "reads four" formats, a claim wrong since v2-S5;
# `14-V2-SCOPE.md` headed a section "why it does not exist yet" about a crate that has existed
# since v2-S2; and the two projection draft schemas published TWO DIFFERENT digests for the same
# representation of the same source. One is not a doc fix: three CLI test harnesses hardcoded
# `../ethos/fixtures` and ignored the `ETHOS_FIXTURES` override `fixtures/manifest.json` declares
# and CI sets, so they resolved a corpus path that exists only where the verifier happens to be a
# sibling checkout. They read the declaration now, as the other five harnesses always have.
#
# The nine profile hashes move on `parser_version` ALONE. Nothing this release corrected was a
# behaviour; every one of them was a sentence a reader could check against the tree and find
# false, which in a repository whose whole claim is auditability is the defect, not the cosmetics.
#
# **0.30.0 is v2-S11: EMBEDDED ASSETS, COUNTED. Not read.** The last undelivered v2 content
# obligation — `02-ROADMAP.md`'s v2 row names it, v2-S2 listed it Out for that slice, and nine
# slices passed without anyone picking it up. It was not merely unread. In THREE READERS OF EIGHT
# it was UNCOUNTED: `word/media/`, `xl/media/` and `ppt/media/` matched no A14 bucket at all, so a
# DOCX with forty embedded images declared ZERO parts not read for them, while ODT, ODS, ODP, RTF
# and EPUB had counted theirs since the slice that added each reader. That is an A14 violation —
# if something is removed, the artifact says so and says HOW MUCH.
#
# A SECOND BUCKET, NOT A WIDER ONE. `office-parts-not-read`'s message says its parts CARRY TEXT.
# A PNG carries none, so folding media into that count would have made a shipped sentence false
# about every package it fires on — a counter's MEANING changing in place under a name that did
# not move, which is exactly what v2-S9.1 was forbidden from doing. `office-embedded-parts-not-read`
# is the second code, and both messages are now true of every file that triggers them.
#
# NO BYTE IS READ. Nothing is decoded, measured, hashed or emitted, and no node is created: an
# embedded asset has no text, no address a citation could bind to and no geometry. A media part is
# identified by WHERE THE PACKAGE PUTS IT, which the package itself states — never by sniffing
# bytes and never by an extension (A4). `pages` stays empty and no locator moved.
#
# THE GAP WAS ALSO UNEXERCISED: none of the three OOXML fixtures held a single media entry, so
# nothing in the suite could have noticed. The fixtures gained media FIRST, and the new test
# asserted the count against the un-fixed readers and failed four ways before anything was fixed.
#
# ODF, EPUB and RTF are unchanged — whole artifacts byte-identical at the same `parser_version`,
# checked against a build of the previous commit. The nine profile hashes move on `parser_version`
# ALONE. **v2 is STILL NOT COMPLETE**: the gate sentence's verb is unsettled, and whether
# "embedded assets" ever meant more than a count is the owner's, not this slice's.
#
# **0.31.0 is v2-S12: THE OFFICE READERS GET FUZZED. No reader changed.** `06-STEAL-REFUSE.md`'s
# A11 asks for mutation testing plus `cargo-fuzz` PER FORMAT, from Anydoc, due at v0. v2-S2
# deferred the office half on the condition that a SECOND office format would reopen it. There
# were EIGHT, and `fuzz/Cargo.toml` still depended on `engine-core` and `engine-pdf` only — no
# office byte had ever been fuzzed. That is not hypothetical: v2-S9's first adversarial finding
# was a PANIC in the percent-decoder, and the review record says it reached review precisely
# because office code is unfuzzed.
#
# ONE TARGET on `engine_office::read`, the single entry point all eight formats share, seeded from
# the sixteen packages in `fixtures/office/`. One rather than eight is MEASURED, not assumed: every
# entry of the grown corpus was driven through the CLI, and all eight readers produced successful
# artifacts from it. Eight harnesses would divide one corpus eight ways.
#
# THE CAMPAIGN RAN: 3,808,191 executions over 3,391 seconds (~57 minutes) across two runs, under
# AddressSanitizer and debug assertions, reaching 8,985 edges and growing the corpus from 16 seeds
# to 2,544 entries. IT FOUND NOTHING — no panic, no out-of-bounds, no overflow, no OOM, no hang.
# That is a RESULT, not a pass: coverage is a lower bound on what is broken, never an upper one,
# and nothing re-runs it. NO CI JOB WAS ADDED; the budget is stated in `15` either way.
#
# A11'S MUTATION HALF IS STILL OPEN for office and is named as open. No office fixture has been
# mutated; they are not in `fixtures/manifest.json`, so the v0-M7 harness does not reach them.
#
# The nine profile hashes move on `parser_version` ALONE, because a build is a build. **v2 IS
# STILL NOT COMPLETE** — the gate sentence's verb is restated for the owner at the end of S12,
# with both readings and what each costs, and it is not settled here.
#
# **0.31.1 is v2-S12.1: THE GUARDS THAT WERE NEVER THERE. No code changed.** v2-S12 shipped a
# third fuzz target that NOTHING COMPILED. `cargo build --workspace` excludes `fuzz/` on purpose,
# CI's `v0-fuzz-smoke` named two targets, and the exit-criteria test that checks the fuzz
# scaffolding iterated a HARDCODED PAIR. So `office_read` could have stopped building against the
# engine API and every job would have stayed green — the same shape as `fuzz/Cargo.lock` sitting
# two slices stale, a thing outside every gate found by a human reading.
#
# THE FIX IS THE BUILD, NOT THE RUN. `cargo fuzz build office_read` joins the existing step;
# v2-S12's decision to add no office fuzz RUN to CI stands and is not reopened. The exit-criteria
# test now reads the target list FROM THE DIRECTORY and asserts, per target, that some CI job
# names it — a list written by hand is what let the third target land unguarded.
#
# The measured statements this slice also repaired are enumerated in `15`'s S12.1, with the ones
# it DECLINED to repair named there too rather than left for someone to rediscover. The office
# MUTATION half of A11 is still open and this slice does not touch it. **v2 IS STILL NOT
# COMPLETE**; both escalated questions are restated unchanged.
version = "0.33.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/docushell/ethos-engine"
authors = ["ethos-engine maintainers"]

[workspace.dependencies]
# Dependencies are constrained by deny.toml: permissive licences only, no AGPL, no network.
# Additions are reviewed against docs/04-ARCHITECTURE.md §5.
#
# M0 declares only what the oracle harness needs. `lopdf`, `ttf-parser`, `serde` and `clap`
# arrive with the milestones that use them (M1-M3), not before.
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# dev-only
proptest = "1"

# internal
engine-core = { path = "crates/engine-core", version = "0.33.0" }
engine-pdf = { path = "crates/engine-pdf", version = "0.33.0" }
engine-office = { path = "crates/engine-office", version = "0.33.0" }
engine-grounding = { path = "crates/engine-grounding", version = "0.33.0" }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
