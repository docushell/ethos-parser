[package]
name = "ethos-parser-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Deliberately names NO subcommand. This string listed the v0 four until v2-S18, by which
# point there were nine — the third site of that drift after `main.rs` and
# `ethos-parser-core/src/verifier.rs`, both repaired at v2-S13.5. Those two are prose that can
# carry the count with its history; a one-line metadata string cannot argue, and nothing
# guards it. `Command` in `src/main.rs` is the list that cannot go stale, so this describes
# what the crate IS rather than what it currently contains.
description = "ethos-parser command line: one thin subcommand per library entry point. No logic."

[[bin]]
name = "ethos-parser"
path = "src/main.rs"

[dependencies]
ethos-parser-core.workspace = true
ethos-parser-pdf.workspace = true
ethos-parser-office.workspace = true
ethos-parser-grounding.workspace = true
serde_json.workspace = true
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
# M0 harness only: verify manifest hashes and read the manifest. Both become real
# dependencies at M1 when the contract types land.
sha2.workspace = true
serde_json.workspace = true
