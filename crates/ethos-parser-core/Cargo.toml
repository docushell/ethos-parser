[package]
name = "ethos-parser-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ethos-parser contract types, canonicalization, quanta, capabilities. No format concepts."

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
# `preserve_order` is enabled ONLY here, and only so `tests/preserve_order.rs` can prove that
# c14n's explicit write-time sort survives it. Cargo features are additive and unify across the
# graph, so this is the exact hazard c14n defends against: any crate anywhere turning this on
# would switch serde_json's Map to insertion order. Enabling it in dev-dependencies reproduces
# that world for the test build without affecting `cargo build`.
serde_json = { workspace = true, features = ["preserve_order"] }
