[package]
name = "ethos-parser-office"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "ethos-parser office reader: OOXML documents, workbooks and presentations, with no pagination."

[dependencies]
ethos-parser-core.workspace = true
# The ZIP container is read here rather than taken from the `zip` crate, and that is a measured
# choice: `zip` pulls twelve transitive crates — including `zopfli`, a *compressor* — to save the
# ~120 lines in `zip.rs` that find one entry in a central directory. `flate2` is already in this
# workspace's graph via `lopdf`'s stream decompression, so the primitive that actually matters
# (inflate) costs nothing new. Same reasoning v1.2-S1 used to refuse an MCP framework.
flate2 = "1"
# XML is NOT hand-rolled, for the opposite reason: entities, namespaces, CDATA and encoding
# declarations are exactly the surface where a hand-rolled reader silently gets text wrong, and
# text is the evidence. `quick-xml` is MIT and its only dependency is `memchr`, which this graph
# already carries.
quick-xml = "0.42"
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
