[package]
name = "ethos-parser-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ethos-parser PDF reader: classification and position-aware extraction."

[dependencies]
rayon = { workspace = true }
ethos-parser-core.workspace = true
lopdf = { version = "0.44.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
# `skrifa` 0.39, not the current 0.44: the newer tree needs Rust 1.89 and this workspace pins
# 1.88 deliberately (see rust-toolchain.toml). 0.39 is the newest version that builds on the
# pinned compiler.
#
# `skrifa` rather than `ttf-parser`, which the milestone named: RUSTSEC-2026-0192 records that
# ttf-parser's author declared it unmaintained with no safe upgrade available, and names skrifa
# (Google Fonts' fontations project) as the maintained successor. Swapping beats ignoring the
# advisory.
skrifa = "0.39.0"

[dev-dependencies]
lopdf = { version = "0.44.0", default-features = false }
serde_json.workspace = true
# v1-S7b. NFC for the table-gate metric's whitespace rule (`accuracy::normalize`).
#
# A **dev**-dependency, not a dependency: `accuracy` is `cfg(test)` and no artifact path reaches
# it, so this stays out of the shipped library's graph entirely. That is what makes it a cheap
# addition rather than one `docs/04-ARCHITECTURE.md` §5 has to weigh.
#
# It is load-bearing rather than precautionary: `cfpb-home-loan-toolkit` draws curly quotes and
# em dashes, so the compared strings are not ASCII and NFC cannot be waved away as the identity.
# MIT OR Apache-2.0; its only dependency, `tinyvec`, is Zlib and already in the allowlist.
unicode-normalization = "0.1"
