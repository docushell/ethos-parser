# ethos-parser fuzz targets.
#
# **Deliberately not a workspace member** (`../Cargo.toml` excludes it). `libfuzzer-sys` and
# `arbitrary` would otherwise enter the workspace dependency graph, where `cargo deny check`
# inspects them and `cargo build --workspace` compiles them — putting a nightly-only sanitizer
# shim into the dependency set of a shipped library for no benefit. The fuzz crate depends on the
# engine; the engine depends on nothing here.
#
# Its own `[workspace]` table below makes that explicit from this side too, so `cargo` inside
# `fuzz/` resolves against `fuzz/Cargo.lock` rather than reaching up.

[package]
name = "ethos-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
ethos-parser-core = { path = "../crates/ethos-parser-core" }
ethos-parser-pdf = { path = "../crates/ethos-parser-pdf" }
ethos-parser-office = { path = "../crates/ethos-parser-office" }

[[bin]]
name = "open_and_classify"
path = "fuzz_targets/open_and_classify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_and_extract"
path = "fuzz_targets/open_and_extract.rs"
test = false
doc = false
bench = false

# v2-S12. ONE target on the router rather than one per format, and the reason is libFuzzer's
# coverage feedback rather than economy: `ethos_parser_office::read` is the single entry point all
# eight formats share and the one the CLI calls, so a corpus seeded with a valid package of each
# shape drives every reader through it. Eight harnesses would split that corpus eight ways and
# explore each branch with a fraction of the budget. If a reader is ever measured unreachable
# from here, that is the evidence for splitting it out — not the shape of the module tree.
[[bin]]
name = "office_read"
path = "fuzz_targets/office_read.rs"
test = false
doc = false
bench = false

# `debug = 1` keeps line numbers in a crash report without the size of full debug info; the rest
# is cargo-fuzz's standard shape.
[profile.release]
debug = 1
