[package]
name = "ethos-parser-ocr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The recognizer behind ethos-parser --ocr: PP-OCRv5 mobile on rten, the same bytes on every supported CPU"

# Exact versions: the same-bytes claim was measured on these (docs/35-OCR-SCOPE.md §3).
[dependencies]
rten = "=0.26.0"
rten-imageproc = "=0.26.0"
rten-tensor = "=0.26.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.11"

[profile.release]
debug = false

# Its own workspace and its own toolchain (rust-toolchain.toml): not a member of the engine's.
[workspace]

# rten-vecmath 0.26.0 with its sums in one fixed order: vendor/rten-vecmath/ETHOS-PATCH.md.
[patch.crates-io]
rten-vecmath = { path = "vendor/rten-vecmath" }
