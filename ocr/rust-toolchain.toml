# The recognizer's own compiler: rten 0.26 needs Rust 1.94. The engine's pin (1.88, at the
# repository root) does not move, so nothing the engine writes without `--ocr` moves
# (docs/35-OCR-SCOPE.md §5). Bumping this is output-affecting for `--ocr`: it belongs in the
# recognizer's identity, and the determinism tests are re-run on the bump.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
