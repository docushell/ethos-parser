# ethos-parser — the Python SDK (v1.2-S2).
#
# **Runtime dependencies are empty, and that is a contract rather than an accident.** This
# package shells out to the `ethos-parser` binary with `subprocess` and parses its stdout with `json`.
# Both are stdlib. A wheel that pulled `requests` or `pydantic` to hand back bytes the CLI
# already printed would be adding a place for those bytes to change.
#
# There is no PyO3, no maturin and no native extension. `docs/history/13-V12-MILESTONES.md` S2 asks for
# "a thin Python surface over the same library or CLI, so it cannot diverge from what the CLI
# prints"; wrapping the CLI makes that a tautology instead of a promise, at the cost of one
# process spawn. A native module would be a fifth build surface and a wheel matrix, and it would
# reach the library by a second path that could then disagree with the first.
#
# NOT PUBLISHED. This is not on PyPI and this slice does not put it there.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethos-parser"
description = "A thin Python surface over the ethos-parser CLI. Locators are minted by the engine, never composed by a caller."
readme = "README.md"
# 3.10 rather than 3.9: 3.9 reached end of life in October 2025, and the dependency gate in
# `tests/test_cli_surface.py` reads `sys.stdlib_module_names`, which arrived in 3.10. Supporting
# a version nobody receives security fixes for, at the cost of the check that proves this package
# pulls nothing, is the wrong trade.
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ethos-parser maintainers" }]
# Empty, and asserted empty by `tests/test_cli_surface.py`. See the note at the top of this file.
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/docushell/ethos-parser"

[project.optional-dependencies]
# **The runtime install stays empty.** `langchain` is an extra so that `import ethos_parser` pulls
# nothing; only `ethos_parser.langchain` needs it, and importing that module without it is a named
# failure rather than a silent skip (v1.2-S4).
#
# `langchain-core` and not the `langchain` hub: the tools need `StructuredTool` and nothing else,
# and pinning a meta-package to get one class is how a wheel acquires a dependency tree nobody
# reviewed.
#
# The range is bounded on both sides for one reason — `response_format="content_and_artifact"`.
# That parameter IS this slice: without it the artifact is stringified into `content`, which is a
# locator a model can edit and then cite. The floor is the oldest line this package is willing to
# claim carries it, and the `<2` ceiling is where the contract could change; a major bump should
# break loudly here rather than silently downgrade the split.
# `tests/test_langchain.py` asserts the parameter is honoured on whatever version is installed, so
# the pin is a declaration and the test is the proof.
langchain = ["langchain-core>=0.3,<2"]

# Dev only. `pip install ethos-parser` installs nothing but this package. The langchain extra is
# included so the S4 tests always run rather than conditionally.
dev = ["pytest>=7", "ethos-parser[langchain]"]

# One source of truth for the version, inside the package, so the distribution metadata cannot
# drift from what `ethos_parser.__version__` reports. A test pins both to the workspace
# `Cargo.toml`, because an SDK claiming a version the engine does not is the same class of lie
# `parser_version` exists to prevent.
[tool.hatch.version]
path = "src/ethos_parser/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ethos_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
